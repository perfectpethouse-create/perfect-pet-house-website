<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ช่วงทดสอบ: ยังไม่ให้ Google เก็บหน้านี้ — ลบบรรทัดนี้ตอนเปิดใช้จริง -->
<meta name="robots" content="noindex">
<title>จองห้องพัก | Perfect Pet House</title>
<meta name="description" content="จองโรงแรมสัตว์เลี้ยงและ Day Care ออนไลน์ เช็คห้องว่างได้ทันที Perfect Pet House วัชรพล-รามอินทรา">
<meta name="theme-color" content="#FFF8F0">
<link rel="icon" href="/images/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --ink:#3A2E26; --ink-soft:#6B5B50; --muted:#8C7B6E; --line:#F3D8C2; --cream:#FFF8F0; --white:#fff;
  --brand:#B85C1E; --brand-ink:#8A4415; --brand-tint:#FCEADB; --accent:#E07B39;
  --ok:#2F6B45; --ok-tint:#E6F2EA; --full:#5E534B; --full-tint:#E9E4DF; --danger:#A33A36;
  --font:'Inter','Noto Sans Thai',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--cream);font-size:15px;line-height:1.5}
a{color:var(--brand)}a:hover{color:var(--brand-ink)}
h1,h2,h3{letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:600;font-size:16px}
.brand img{width:28px;height:36px;object-fit:contain}
.top a.line{font-weight:500;font-size:14px}

.wrap{max-width:1080px;margin:0 auto;padding:0 16px 140px;display:grid;gap:28px}
@media(min-width:960px){.wrap{grid-template-columns:minmax(0,1fr) 340px;padding-bottom:60px;align-items:start}}
.progress{display:flex;gap:6px;margin:16px 0 6px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--brand)}
.stepname{font-size:13px;color:var(--ink-soft)}
.back{background:none;border:0;padding:8px 0;color:var(--brand);font-weight:500;font-size:14px;min-height:44px}
h1.t{font-size:26px;font-weight:700;margin:8px 0 4px}
.sub{color:var(--ink-soft);margin:0 0 18px}
.lbl{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);margin:0 0 6px}
.grp{margin-bottom:18px}
.seg{display:flex;gap:10px}
.seg button{flex:1;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px}
.seg button small{font-size:12px;font-weight:400;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-ink)}
.field{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;font-size:16px}
.field:focus,.seg button:focus-visible,.btn:focus-visible{outline:3px solid rgba(184,92,30,.35);outline-offset:1px}
textarea.field{min-height:72px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hint{font-size:13px;color:var(--ink-soft);margin:6px 0 0}
.err{font-size:13px;color:var(--danger);margin:6px 0 0;font-weight:500}
.stepper{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);font-size:20px}
.stepper output{min-width:40px;text-align:center;font-weight:600}
.note{display:flex;gap:10px;align-items:flex-start;background:#EEF5F0;border-radius:12px;padding:12px 14px;color:#2F5E40;font-size:14px}
.note.warn{background:var(--brand-tint);color:#5A3A22}

.rooms{display:grid;gap:14px}
@media(min-width:700px){.rooms{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
.room{background:#fff;border:1.5px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.room.sel{border:2.5px solid var(--brand);box-shadow:0 8px 24px rgba(184,92,30,.16)}
.room.full{background:#F7F2EC}
.room.full img{filter:grayscale(.85);opacity:.7}
.room img{width:100%;height:160px;object-fit:cover;display:block;background:var(--brand-tint)}
.room .b{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.room h3{font-size:18px;font-weight:700}
.pill{display:inline-flex;align-self:flex-start;font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px}
.pill.ok{background:var(--ok-tint);color:var(--ok)}
.pill.last{background:var(--brand-tint);color:var(--brand-ink)}
.pill.full{background:var(--full-tint);color:var(--full)}
.pill.unk{background:#EEF0F3;color:#45505C}
.feat{font-size:13px;color:var(--ink-soft)}
.price{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto}
.strike{font-size:13px;color:var(--muted);text-decoration:line-through}
.big{font-size:20px;font-weight:700}
.online{font-size:12px;font-weight:600;color:var(--brand-ink)}
.btn{min-height:48px;border-radius:12px;border:0;background:var(--brand);color:#fff;font-weight:600;font-size:15px;padding:0 18px}
.btn.ghost{background:#fff;border:1.5px solid var(--brand);color:var(--brand-ink)}
.btn.line{background:#06C755;color:#0B2E17}
.btn:disabled{opacity:.45;cursor:not-allowed}
.upsell{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px dashed var(--accent);border-radius:14px;padding:12px 14px;margin-top:14px}

.addon{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px;min-height:64px;margin-bottom:10px}
.addon.on{border-color:var(--brand);background:#FFF4EA}
.addon input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand);flex:none;margin:0}
.addon label{flex:1;cursor:pointer}
.addon .nm{font-weight:500}
.addon .pr{font-size:13px;color:var(--ink-soft)}
.addon .q{display:flex;align-items:center;gap:6px}
.addon .q button{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:18px}
.addon .q output{min-width:52px;text-align:center;font-size:14px;font-weight:600}

.policy{background:var(--brand-tint);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.6;color:#5A3A22;margin:14px 0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:10px 0}
.chk input{width:20px;height:20px;accent-color:var(--brand);margin:2px 0 0;flex:none}

.card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:18px}
.sum{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}
.sum.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-weight:600}
.sum.dep{color:var(--brand-ink);font-weight:700;font-size:16px}
.sum.muted{color:var(--ink-soft)}
aside .card{position:sticky;top:84px}
aside .btn{width:100%;margin-top:12px}
@media(max-width:959px){aside{display:none}}

.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;z-index:30}
.bar .t{flex:1;min-width:0}
.bar .t small{display:block;font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t b{font-size:19px}
.bar .btn{min-height:52px;padding:0 26px}
@media(min-width:960px){.bar{display:none}}

.done-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;margin:20px 0 16px}
.done-ic{width:56px;height:56px;border-radius:50%;background:var(--ok-tint);display:flex;align-items:center;justify-content:center}
.code{font-size:18px;font-weight:700;letter-spacing:.5px;color:var(--ink)}
.amount{font-size:34px;font-weight:700;color:var(--brand-ink);text-align:center}
.acct{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--cream);border-radius:12px;padding:10px 10px 10px 14px;margin:8px 0}
.acct .no{font-size:21px;font-weight:700;letter-spacing:1px}
.steps{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.steps div{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.steps span{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:50}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="/"><img src="/images/img01.png" alt="">Perfect Pet House</a>
    <a class="line" href="https://line.me/R/ti/p/@perfectbkk" target="_blank" rel="noopener">ทัก LINE</a>
  </div>
</header>

<div class="wrap">
  <main id="main" aria-live="polite"></main>
  <aside><div class="card" id="aside"></div></aside>
</div>
<div class="bar" id="bar"></div>

<script>
(function(){
'use strict';

// ═══ ค่าคงที่ (ตรงกับระบบหลังบ้าน pph-booking) ═══
var FS = 'https://firestore.googleapis.com/v1/projects/pph-booking/databases/(default)/documents';
var KEY = 'AIzaSyCi7sSXV0Sz85XqWI0hVTGw-BbNd8Cxox0';
var GAS = 'https://script.google.com/macros/s/AKfycbwnGROqOa9rnr4OEyLNRD-MeKxefqc0ynDn4I3nnKpkIiLvDrYQsH3R-2NdXCiLCmcg/exec';
var LINE_OA = '@perfectbkk';
var BANK = { name:'ธนาคารกสิกรไทย', en:'Kasikorn Bank', no:'237-2-68231-3', holder:'บจก.เพอร์เฟค เพ็ต เฮ้าส์' };

// ค่าสำรองเมื่อโหลดข้อมูลจากระบบร้านไม่ได้ (ราคาเดียวกับ config-shop.js)
var FALLBACK = {
  prices: { cozy:{label:'Cozy Room',dog:790,cat:690}, deluxe:{label:'Deluxe Room',dog:990,cat:990}, vip:{label:'VIP Villa Room',dog:1890,cat:1890} },
  online: { vip:{dog:1590,cat:1390} },
  longStay: [{minNights:10,pct:10},{minNights:5,pct:5}],
  depositPct: 50, holdHours: 2,
  addOns: [
    {name:'พี่เลี้ยงนอนด้วย',unitPrice:300,unit:'คืน'},{name:'กล้องวงจรปิด',unitPrice:100,unit:'คืน'},
    {name:'ป้อนยา',unitPrice:200,unit:'ตัว'},{name:'ต้มอาหารให้',unitPrice:50,unit:'มื้อ'},{name:'สปาโอโซน',unitPrice:150,unit:'ครั้ง'}
  ],
  daycare: { capacity:{dogSmall:5,dogLarge:5,cat:10},
    prices:{dog:{s:450,m:500,l:550,xl:600},cat:{s:400,m:450,l:500,xl:550}} },
  capacity: null, used: {}, dcUsed: {}
};
var ROOM_INFO = {
  cozy:   { dog:'1×1.5 ม.', cat:'1×1 ม.' },
  deluxe: { dog:'1×2 ม.',   cat:'1×1×2.5 ม. (แนวตั้ง)' },
  vip:    { dog:'1.5×2.5 ม.', cat:'1.5×2.5 ม.' }
};
var ROOM_ORDER = ['vip','deluxe','cozy'];
var POLICY = [
  'มัดจำ 50% เพื่อยืนยันการจอง ชำระส่วนที่เหลือวันเข้าพัก',
  'Low season: ยกเลิก/เลื่อนแจ้งล่วงหน้าอย่างน้อย 3 วัน · ไม่มีนโยบายคืนเงิน แต่เก็บยอดเป็นเครดิตใช้ภายใน 6 เดือนนับจากวันจอง (หักได้เฉพาะค่าห้องพัก)',
  'High season (5–20 เม.ย. และ 15 ธ.ค.–5 ม.ค.): ไม่มีนโยบายคืนเงิน และไม่เก็บยอดเป็นเครดิตหากยกเลิก',
  'เช็คอิน 9:00–18:00 น. · เช็คเอาท์ภายใน 14:00 น. (หลังจากนั้นคิดค่า Day Care)'
];
var STEPS = ['วันที่และน้อง','เลือกห้อง','บริการเสริม','ข้อมูลและเงื่อนไข','มัดจำ'];

// ═══ state ═══
var D = JSON.parse(JSON.stringify(FALLBACK)); // ข้อมูลร้าน (จะทับด้วยของจริงถ้าโหลดได้)
var LIVE = false;   // โหลดห้องว่างจริงได้ไหม
var HOLDS = [];     // การกันห้องที่ยังไม่หมดอายุ
var S = {
  step:1, service:'stay', pet:'dog', pets:1,
  checkIn:'', checkOut:'', date:'', arrive:'10:00', weight:'',
  roomType:'', rooms:1, addons:{},
  owner:'', phone:'', line:'', email:'', petname:'', breed:'', note:'', wantGroom:false, accept:false,
  errors:{}, sending:false, result:null
};

// ═══ utils ═══
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function baht(n){ return '฿' + (Math.round(Number(n)*100)/100).toLocaleString('th-TH'); }
function r2(n){ return Math.round((Number(n)+Number.EPSILON)*100)/100; }
function iso(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function today(){ return iso(new Date()); }
function addDays(s,n){ var d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return iso(d); }
function nightsOf(a,b){ if(!a||!b) return 0; var n=Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); return n>0?n:0; }
function eachDate(a,b,cb){ var d=a, g=0; while(d<b && g++<400){ cb(d); d=addDays(d,1); } }
function thDate(s,withDay){ if(!s) return '-'; var d=new Date(s+'T00:00:00'); return d.toLocaleDateString('th-TH',withDay===false?{day:'numeric',month:'short'}:{weekday:'short',day:'numeric',month:'short'}); }
function toast(t){ var el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(function(){ el.remove(); },2200); }
function copy(t){
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){toast('คัดลอกแล้ว');},function(){fallbackCopy(t);}); return; } }catch(e){}
  fallbackCopy(t);
}
function fallbackCopy(t){ var a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand('copy'); toast('คัดลอกแล้ว');}catch(e){} a.remove(); }

// ═══ ราคา (สูตรเดียวกับ calc.js ฝั่งหลังบ้าน) ═══
function longStayPct(n){
  var t=(D.longStay||[]).slice().sort(function(a,b){return b.minNights-a.minNights;});
  for(var i=0;i<t.length;i++) if(n>=t[i].minNights) return Number(t[i].pct)||0;
  return 0;
}
function nextTier(n){
  var t=(D.longStay||[]).slice().sort(function(a,b){return a.minNights-b.minNights;});
  for(var i=0;i<t.length;i++) if(n<t[i].minNights) return t[i];
  return null;
}
function listPrice(rt,pet){ return Number(D.prices[rt] && D.prices[rt][pet]) || 0; }
function unitPrice(rt,pet){
  var o = D.online && D.online[rt] && Number(D.online[rt][pet]);
  var l = listPrice(rt,pet);
  return (o && o < l) ? o : l;
}
function weightKg(){ var w=parseFloat(String(S.weight).replace(',','.')); return w>0?w:0; }
function dcSize(){
  var w=weightKg(), cat=S.pet==='cat';
  if(cat) return w<3?'s':w<7?'m':w<11?'l':'xl';
  return w<5?'s':w<10?'m':w<20?'l':'xl';
}
function dcGroup(){ return S.pet==='cat' ? 'cat' : (weightKg()>=15 ? 'dogLarge' : 'dogSmall'); }
function addonList(){
  return (D.addOns||[]).filter(function(a){ return S.service==='stay' || a.unit!=='คืน'; });
}
function defaultQty(a){
  var n=nightsOf(S.checkIn,S.checkOut)||1;
  if(a.unit==='คืน') return n;
  if(a.unit==='ตัว') return S.pets;
  return 1;
}
function totals(){
  var n = S.service==='stay' ? nightsOf(S.checkIn,S.checkOut) : 0;
  var room=0, list=0, disc=0, pct=0, unit=0, dcUnit=0;
  if(S.service==='stay' && S.roomType){
    unit = unitPrice(S.roomType,S.pet);
    var gross = r2(unit*S.rooms*n);
    pct = longStayPct(n);
    disc = pct ? Math.round(gross*pct/100) : 0; // ปัดเป็นบาทเต็ม (หลังบ้านบันทึกเป็นส่วนลดแบบจำนวนเงิน)
    room = r2(gross-disc);
    list = listPrice(S.roomType,S.pet);
  }
  if(S.service==='daycare'){
    dcUnit = Number(D.daycare.prices[S.pet][dcSize()])||0;
    room = r2(dcUnit*S.pets);
  }
  var adds = [], addSum = 0;
  addonList().forEach(function(a){
    var q=S.addons[a.name]; if(!q) return;
    var t=r2(a.unitPrice*q); addSum=r2(addSum+t);
    adds.push({name:a.name,unitPrice:a.unitPrice,qty:q,unit:a.unit,total:t});
  });
  var grand = r2(room+addSum);
  var dep = Math.round(grand*(D.depositPct==null?50:D.depositPct)/100);
  return { nights:n, unit:unit, list:list, pct:pct, disc:disc, room:room, dcUnit:dcUnit, addOns:adds, addSum:addSum, grand:grand, deposit:dep, balance:r2(grand-dep) };
}

// ═══ ห้องว่าง ═══
function roomStatus(rt){
  if(!LIVE || !D.capacity || !D.capacity[rt]) return {s:'unk'};
  var cap = Number(D.capacity[rt][S.pet])||0;
  if(cap<=0) return {s:'full',free:0};
  var minFree = Infinity;
  eachDate(S.checkIn, S.checkOut, function(d){
    var used = (D.used[d] && D.used[d][rt+'|'+S.pet]) || 0;
    HOLDS.forEach(function(h){ if(h.kind!=='daycare' && h.roomType===rt && h.pet===S.pet && h.checkIn<=d && d<h.checkOut) used += h.rooms||1; });
    minFree = Math.min(minFree, cap-used);
  });
  if(minFree===Infinity) minFree=cap;
  var need = S.rooms;
  if(minFree < 1) return {s:'full',free:0};
  if(minFree < need) return {s:'full',free:minFree};
  return {s: minFree===need ? 'last' : 'ok', free:minFree};
}
function dcStatus(){
  if(!LIVE) return {s:'unk'};
  var g=dcGroup(), cap=Number((D.daycare.capacity||{})[g])||0;
  var used=(D.dcUsed[S.date] && D.dcUsed[S.date][g]) || 0;
  HOLDS.forEach(function(h){ if(h.kind==='daycare' && h.dcGroup===g && h.checkIn===S.date) used += h.count||1; });
  var free=cap-used;
  if(free < S.pets) return {s:'full',free:Math.max(0,free)};
  return {s: free===S.pets ? 'last':'ok', free:free};
}
function pillHtml(st){
  if(st.s==='ok') return '<span class="pill ok">● ว่าง</span>';
  if(st.s==='last') return '<span class="pill last">เหลือที่สุดท้าย</span>';
  if(st.s==='full') return '<span class="pill full">เต็มช่วงวันนี้</span>';
  return '<span class="pill unk">ร้านยืนยันห้องว่างทาง LINE</span>';
}

// ═══ โหลดข้อมูลจากระบบร้าน ═══
function fval(f){
  if(!f) return null;
  if('stringValue' in f) return f.stringValue;
  if('integerValue' in f) return Number(f.integerValue);
  if('doubleValue' in f) return Number(f.doubleValue);
  if('timestampValue' in f) return f.timestampValue;
  return null;
}
function loadData(){
  var a = fetch(FS+'/publicAvailability/main?key='+KEY).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){
    var data = JSON.parse(fval(j.fields && j.fields.json) || 'null');
    if(!data || !data.prices) throw 0;
    ['prices','online','longStay','depositPct','holdHours','addOns','capacity','used','dcUsed'].forEach(function(k){ if(data[k]!=null) D[k]=data[k]; });
    if(data.daycare){ D.daycare.capacity = data.daycare.capacity || D.daycare.capacity; D.daycare.prices = data.daycare.prices || D.daycare.prices; }
    LIVE = true;
  }).catch(function(){ LIVE=false; });
  var b = fetch(FS+'/roomHolds?pageSize=300&key='+KEY).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){
    var now=Date.now();
    HOLDS = (j.documents||[]).map(function(doc){
      var f=doc.fields||{}, o={};
      Object.keys(f).forEach(function(k){ o[k]=fval(f[k]); });
      return o;
    }).filter(function(h){ return Date.parse(h.expiresAt) > now; });
  }).catch(function(){ HOLDS=[]; });
  return Promise.all([a,b]);
}

// ═══ ส่งคำขอจอง ═══
function genCode(){
  var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s='';
  for(var i=0;i<4;i++) s+=c[Math.floor(Math.random()*c.length)];
  return 'PPH-'+today().slice(2).replace(/-/g,'')+'-'+s;
}
function fsFields(o){
  var f={};
  Object.keys(o).forEach(function(k){
    var v=o[k];
    if(v && v.__ts) f[k]={timestampValue:v.__ts};
    else if(typeof v==='number' && Number.isInteger(v)) f[k]={integerValue:String(v)};
    else f[k]={stringValue:String(v==null?'':v)};
  });
  return {fields:f};
}
function post(col, obj){
  return fetch(FS+'/'+col+'?key='+KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fsFields(obj))})
    .then(function(r){ if(!r.ok) throw new Error(col+' '+r.status); return r.json(); });
}
function summaryText(code,t){
  var L=['🐾 จองออนไลน์ Perfect Pet House','รหัสจอง: '+code,'──────────────',
    '👤 '+S.owner+' · 📞 '+S.phone];
  if(S.line) L.push('💬 LINE: '+S.line);
  L.push((S.pet==='cat'?'🐱 แมว':'🐶 สุนัข')+' '+S.pets+' ตัว · ชื่อน้อง: '+S.petname+(S.breed?' ('+S.breed+')':'')+(S.weight?' · '+S.weight+' กก.':''));
  if(S.service==='stay'){
    L.push('🏨 '+D.prices[S.roomType].label+' × '+S.rooms+' ห้อง · '+baht(t.unit)+'/คืน');
    L.push('📅 '+S.checkIn+' → '+S.checkOut+' ('+t.nights+' คืน) · มาถึง '+S.arrive+' น.');
    if(t.pct) L.push('🎁 ส่วนลดพักยาว '+t.pct+'% (-'+baht(t.disc)+')');
  } else {
    L.push('☀️ Day Care เหมาวัน ไซส์ '+dcSize().toUpperCase()+' × '+S.pets+' ตัว · '+baht(t.dcUnit)+'/ตัว');
    L.push('📅 '+S.date+' · มาถึง '+S.arrive+' น.');
  }
  t.addOns.forEach(function(a){ L.push('➕ '+a.name+' '+a.qty+' '+a.unit+' = '+baht(a.total)); });
  L.push('💰 รวม '+baht(t.grand)+' · มัดจำ 50% '+baht(t.deposit));
  if(S.wantGroom) L.push('✂️ สนใจอาบน้ำ–ตัดขนก่อนกลับบ้าน');
  if(S.note) L.push('📝 '+S.note);
  return L.join('\n');
}
function submit(){
  if(S.sending) return;
  S.sending=true; render();
  var t=totals(), code=genCode();
  var holdUntil=new Date(Date.now()+(D.holdHours||2)*3600000).toISOString();
  var stay=S.service==='stay';
  var payload = {
    v:1, code:code, kind:stay?'stay':'daycare', pet:S.pet, pets:S.pets,
    roomType:stay?S.roomType:'', roomLabel:stay?D.prices[S.roomType].label:'', rooms:stay?S.rooms:0,
    checkIn:stay?S.checkIn:S.date, checkOut:stay?S.checkOut:S.date, nights:t.nights,
    pricePerNight:t.unit, listPrice:t.list, longStayPct:t.pct, longStayDisc:t.disc,
    daycare: stay?null:{ size:dcSize(), group:dcGroup(), unitPrice:t.dcUnit, count:S.pets },
    addOns:t.addOns.map(function(a){ return {name:a.name,unitPrice:a.unitPrice,qty:a.qty,unit:a.unit}; }),
    arriveTime:S.arrive, weightKg:S.weight, wantGroom:S.wantGroom,
    depositPct:D.depositPct, totals:{grand:t.grand,deposit:t.deposit,balance:t.balance},
    holdUntil:holdUntil, acceptedPolicyAt:new Date().toISOString(), liveAvailability:LIVE
  };
  var hold = { code:code, kind:payload.kind, roomType:payload.roomType, pet:S.pet, rooms:stay?S.rooms:0,
    checkIn:payload.checkIn, checkOut:payload.checkOut, dcGroup:stay?'':dcGroup(), count:S.pets,
    expiresAt:{__ts:holdUntil}, createdAt:new Date().toISOString() };
  var msg = summaryText(code,t);
  var webData = {
    owner:S.owner, phone:S.phone, line:S.line, email:S.email,
    pet:S.pet==='cat'?'น้องแมว':'น้องหมา', petname:S.petname, breed:S.breed,
    service: stay ? 'ฝากเลี้ยง (ค้างคืน)' : 'Day Care',
    room: stay ? D.prices[S.roomType].label : '',
    checkin: payload.checkIn, checkout: stay ? S.checkOut : '',
    time: S.arrive, note: S.note
  };
  var holdId='';
  post('roomHolds', hold).then(function(j){ holdId=(j.name||'').split('/').pop(); }).catch(function(){})
  .then(function(){
    var req = Object.assign({}, webData, { source:'/booking.html', submittedAt:new Date().toISOString(), status:'new',
      code:code, holdId:holdId, payloadJson:JSON.stringify(payload) });
    var p1 = post('bookingRequests', req).then(function(){return true;},function(){return false;});
    // แจ้งเตือนร้าน + ลง Google Sheets + ปฏิทิน (Apps Script เดิม)
    var p2 = fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(Object.assign({}, webData, { message:msg, submittedAt:new Date().toLocaleString('th-TH') }))})
      .then(function(r){return r.json();}).then(function(j){ return !!(j&&j.ok); }).catch(function(){return false;});
    return Promise.all([p1,p2]);
  }).then(function(ok){
    S.sending=false;
    S.result = { code:code, t:t, holdUntil:holdUntil, msg:msg, ok:ok[0]||ok[1], held:!!holdId,
      label: stay ? D.prices[S.roomType].label : 'Day Care', when: stay ? (thDate(S.checkIn)+' – '+thDate(S.checkOut)+' ('+t.nights+' คืน)') : thDate(S.date) };
    try{ sessionStorage.setItem('pph_last_booking', JSON.stringify(S.result)); }catch(e){}
    S.step=5; render(); window.scrollTo(0,0);
  });
}

// ═══ validation ═══
function validate(step){
  var e={};
  if(step===1){
    var t=today();
    if(S.service==='stay'){
      if(!S.checkIn) e.checkIn='เลือกวันเช็คอิน';
      else if(S.checkIn<t) e.checkIn='เลือกวันตั้งแต่วันนี้เป็นต้นไป';
      if(!S.checkOut) e.checkOut='เลือกวันเช็คเอาท์';
      else if(S.checkIn && S.checkOut<=S.checkIn) e.checkOut='ต้องหลังวันเช็คอินอย่างน้อย 1 คืน';
      else if(nightsOf(S.checkIn,S.checkOut)>60) e.checkOut='จองออนไลน์ได้ไม่เกิน 60 คืน — ทัก LINE ได้เลย';
    } else {
      if(!S.date) e.date='เลือกวันที่'; else if(S.date<t) e.date='เลือกวันตั้งแต่วันนี้เป็นต้นไป';
      if(!weightKg()) e.weight='ใส่น้ำหนักน้องโดยประมาณ เพื่อคิดราคาตามไซส์';
    }
  }
  if(step===2){
    if(S.service==='stay'){
      if(!S.roomType) e.room='เลือกห้องที่ต้องการ';
      else if(roomStatus(S.roomType).s==='full') e.room='ห้องนี้เต็มช่วงวันที่เลือก';
    } else if(dcStatus().s==='full') e.room='Day Care วันนี้เต็มแล้ว ลองเลือกวันอื่น';
  }
  if(step===4){
    if(!S.owner.trim()) e.owner='กรอกชื่อของคุณ';
    var ph=S.phone.replace(/\D/g,'');
    if(ph.length<9||ph.length>10) e.phone='เบอร์โทร 9–10 หลัก';
    if(!S.petname.trim()) e.petname='กรอกชื่อน้อง';
    if(S.service==='stay' && !weightKg() && S.weight) e.weight='ใส่เป็นตัวเลข';
    if(S.email && !/^\S+@\S+\.\S+$/.test(S.email)) e.email='อีเมลไม่ถูกต้อง';
    if(!S.accept) e.accept='กรุณายอมรับเงื่อนไขก่อนส่ง';
  }
  S.errors=e;
  return !Object.keys(e).length;
}
function go(n){
  if(n>S.step && !validate(S.step)){ render(); var f=document.querySelector('.err'); if(f) f.scrollIntoView({block:'center',behavior:'smooth'}); return; }
  S.errors={};
  S.step=n; render(); window.scrollTo(0,0);
}

function progress(){
  var h='<div class="progress" aria-hidden="true">';
  for(var i=1;i<=5;i++) h+='<i class="'+(i<=S.step?'on':'')+'"></i>';
  return h+'</div><div class="stepname">ขั้นที่ '+S.step+' จาก 5 · '+STEPS[S.step-1]+'</div>';
}
function backBtn(){ return S.step>1 && S.step<5 ? '<button class="back" data-go="'+(S.step-1)+'">← ย้อนกลับ</button>' : ''; }

  '<h2 style="font-size:17px;margin:4px 0 10px">เจ้าของน้อง</h2>'+
  '<div class="grp"><label class="lbl" for="ow">ชื่อ–นามสกุล</label><input class="field" id="ow" data-k="owner" autocomplete="name" value="'+esc(S.owner)+'">'+err('owner')+'</div>'+
  '<div class="grp two"><div><label class="lbl" for="ph">เบอร์โทร</label><input class="field" id="ph" data-k="phone" inputmode="tel" autocomplete="tel" placeholder="08x-xxx-xxxx" value="'+esc(S.phone)+'">'+err('phone')+'</div>'+
  '<div><label class="lbl" for="ln">LINE ID</label><input class="field" id="ln" data-k="line" placeholder="ไว้ส่งรูปน้อง" value="'+esc(S.line)+'"></div></div>'+
  '<div class="grp"><label class="lbl" for="em">อีเมล (ไม่บังคับ — รับสรุปการจองทางอีเมล)</label><input class="field" id="em" data-k="email" type="email" autocomplete="email" value="'+esc(S.email)+'">'+err('email')+'</div>'+
  '<h2 style="font-size:17px;margin:12px 0 10px">น้อง</h2>'+
  '<div class="grp two"><div><label class="lbl" for="pn">ชื่อน้อง'+(S.pets>1?' (ทุกตัว)':'')+'</label><input class="field" id="pn" data-k="petname" value="'+esc(S.petname)+'">'+err('petname')+'</div>'+
  '<div><label class="lbl" for="br">สายพันธุ์</label><input class="field" id="br" data-k="breed" value="'+esc(S.breed)+'"></div></div>'+
  (S.service==='stay'?'<div class="grp"><label class="lbl" for="wt2">น้ำหนักโดยประมาณ (กก.)</label><input class="field" id="wt2" data-k="weight" inputmode="decimal" value="'+esc(S.weight)+'">'+err('weight')+'</div>':'')+
  '<div class="grp"><label class="lbl" for="nt">สิ่งที่อยากให้เรารู้ (อาหาร ยา นิสัย)</label><textarea class="field" id="nt" data-k="note">'+esc(S.note)+'</textarea></div>'+
  '<div class="card" style="margin:6px 0">'+sumHtml(t)+'</div>'+
  '<div class="policy"><b>เงื่อนไขการจอง / ยกเลิก</b><br>'+POLICY.map(esc).join('<br>')+'</div>'+
  '<label class="chk"><input type="checkbox" data-k="accept"'+(S.accept?' checked':'')+'><span>ฉันอ่านและยอมรับกฎระเบียบการเข้าพักและนโยบายการยกเลิก</span></label>'+err('accept');
}
function step5(){
  var r=S.result; if(!r) return '';
  var lineMsg='ส่งสลิปมัดจำ รหัสจอง '+r.code+' ยอด '+baht(r.t.deposit);
  var lineUrl='https://line.me/R/oaMessage/'+LINE_OA+'/?'+encodeURIComponent(lineMsg);
  var hrs=(D.holdHours||2);
  if(!r.ok){
    return '<div class="done-head"><h1 class="t">ส่งอัตโนมัติไม่สำเร็จ</h1><p class="sub">กรุณาคัดลอกข้อความด้านล่างส่งทาง LINE '+LINE_OA+' หรือโทร <a href="tel:0823202807">082-320-2807</a></p></div>'+
      '<div class="card"><pre style="white-space:pre-wrap;font:inherit;font-size:14px;margin:0">'+esc(r.msg)+'</pre></div>'+
      '<button class="btn" style="width:100%;margin-top:12px" data-copy="msg">คัดลอกข้อความ</button>'+
      '<a class="btn line" style="display:flex;align-items:center;justify-content:center;margin-top:10px;text-decoration:none" href="https://line.me/R/ti/p/'+LINE_OA+'" target="_blank" rel="noopener">เปิด LINE '+LINE_OA+'</a>';
  }
  return '<div class="done-head"><div class="done-ic"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2F6B45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>'+
    '<h1 class="t">ส่งคำขอจองแล้ว</h1><div>รหัสจอง <span class="code">'+esc(r.code)+'</span></div>'+
    '<span class="pill last">รอมัดจำ · '+(r.held?'กันห้องไว้ให้ '+hrs+' ชั่วโมง':'ร้านจะยืนยันห้องทาง LINE')+'</span>'+
    (r.held?'<p class="hint" style="margin:0">ถ้ายังไม่โอนและส่งสลิปภายใน '+hrs+' ชม. (ถึง '+new Date(r.holdUntil).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})+' น.) ระบบจะปล่อยห้องให้ลูกค้าท่านอื่นอัตโนมัติ</p>':'')+
    '</div>'+
  '<div class="card"><div class="feat" style="text-align:center">ยอดมัดจำ 50%</div><div class="amount">'+baht(r.t.deposit)+'</div>'+
    '<div style="border-top:1px dashed var(--line);margin-top:12px;padding-top:12px">'+
    '<div style="font-weight:600">'+BANK.name+' <span class="feat">'+BANK.en+'</span></div>'+
    '<div class="acct"><div><div class="feat">เลขบัญชี</div><div class="no">'+BANK.no+'</div></div><button class="btn ghost" data-copy="acct" style="min-height:44px">คัดลอก</button></div>'+
    '<div class="feat">ชื่อบัญชี</div><div style="font-weight:500">'+BANK.holder+'</div></div></div>'+
  '<div class="steps"><div><span>1</span><p style="margin:3px 0 0">โอนมัดจำ <b>'+baht(r.t.deposit)+'</b> เข้าบัญชีด้านบน</p></div>'+
    '<div><span>2</span><p style="margin:3px 0 0">กดปุ่มด้านล่าง ส่งสลิปใน LINE — รหัสจองพิมพ์ไว้ให้แล้ว</p></div>'+
    '<div><span>3</span><p style="margin:3px 0 0">ร้านตรวจสลิปแล้วส่งใบยืนยันการจองให้ทาง LINE</p></div></div>'+
  '<a class="btn line" style="display:flex;align-items:center;justify-content:center;text-decoration:none;min-height:52px;font-size:17px" href="'+lineUrl+'" target="_blank" rel="noopener">ส่งสลิปทาง LINE '+LINE_OA+'</a>'+
  '<div class="card" style="margin-top:14px;font-size:14px;color:var(--ink-soft)">'+esc(r.label)+' · '+esc(r.when)+'<br>ยอดรวม '+baht(r.t.grand)+' · ส่วนที่เหลือ '+baht(r.t.balance)+' ชำระวันเข้าพัก<br>แนะนำให้แคปหน้าจอนี้เก็บไว้</div>';
}
function sumHtml(t){
  var h='<div style="font-weight:700;font-size:17px;margin-bottom:6px">สรุปการจอง</div>';
  if(S.service==='stay'){
    if(!S.roomType) return h+'<p class="feat" style="margin:0">'+(S.checkIn&&S.checkOut?thDate(S.checkIn,false)+' – '+thDate(S.checkOut,false)+' · '+nightsOf(S.checkIn,S.checkOut)+' คืน':'เลือกวันที่และห้อง')+'</p>';
    h+='<div class="sum"><span>'+esc(D.prices[S.roomType].label)+' '+baht(t.unit)+' × '+t.nights+' คืน'+(S.rooms>1?' × '+S.rooms+' ห้อง':'')+'</span><span>'+baht(r2(t.unit*t.nights*S.rooms))+'</span></div>';
    if(t.pct) h+='<div class="sum" style="color:var(--ok)"><span>ส่วนลดพักยาว '+t.pct+'%</span><span>-'+baht(t.disc)+'</span></div>';
  } else {
    h+='<div class="sum"><span>Day Care ไซส์ '+dcSize().toUpperCase()+' '+baht(t.dcUnit)+' × '+S.pets+' ตัว</span><span>'+baht(t.room)+'</span></div>';
  }
  t.addOns.forEach(function(a){ h+='<div class="sum"><span>'+esc(a.name)+' × '+a.qty+' '+esc(a.unit)+'</span><span>'+baht(a.total)+'</span></div>'; });
  h+='<div class="sum tot"><span>รวมทั้งหมด</span><span>'+baht(t.grand)+'</span></div>'+
     '<div class="sum dep"><span>มัดจำ 50% ตอนนี้</span><span>'+baht(t.deposit)+'</span></div>'+
     '<div class="sum muted"><span>ชำระวันเข้าพัก</span><span>'+baht(t.balance)+'</span></div>';
  return h;
}
function nextLabel(){
  return ['', 'ดูห้องว่าง', 'ถัดไป', 'ถัดไป', S.sending?'กำลังส่ง…':'ส่งคำขอจอง'][S.step];
}
function render(){
  var t=totals();
  $('main').innerHTML = [null,step1,step2,step3,step4,step5][S.step]();
  var bar=$('bar'), aside=$('aside');
  if(S.step===5){ bar.classList.add('hidden'); aside.innerHTML=S.result?'<div style="font-weight:700">'+esc(S.result.code)+'</div><p class="feat">โอนมัดจำแล้วส่งสลิปทาง LINE '+LINE_OA+'</p>':''; return; }
  bar.classList.remove('hidden');
  var small = S.step===1 ? (S.service==='stay' ? 'เลือกวันเข้า–ออก' : 'Day Care') :
    (S.service==='stay' ? (S.roomType? D.prices[S.roomType].label+' · '+t.nights+' คืน' : 'ยังไม่ได้เลือกห้อง') : 'Day Care · '+S.pets+' ตัว');
  var showTotal = S.step>1 && (S.service==='daycare' || S.roomType);
  bar.innerHTML='<div class="t"><small>'+esc(small)+(S.step===4&&showTotal?' · มัดจำ '+baht(t.deposit):'')+'</small><b>'+(showTotal?baht(t.grand):'')+'</b></div>'+
    '<button class="btn" data-next'+(S.sending?' disabled':'')+'>'+nextLabel()+'</button>';
  aside.innerHTML = sumHtml(t)+'<button class="btn" data-next'+(S.sending?' disabled':'')+'>'+nextLabel()+'</button>'+
    '<p class="feat" style="margin:10px 0 0">เช็คอิน 9:00–18:00 น. · เช็คเอาท์ภายใน 14:00 น.</p>';
}

// ═══ events (delegation) ═══
document.addEventListener('click', function(e){
  var b=e.target.closest('button,[data-copy]'); if(!b) return;
  if(b.hasAttribute('data-next')){
    if(S.step===4){ if(validate(4)) submit(); else { render(); var f=document.querySelector('.err'); if(f) f.scrollIntoView({block:'center',behavior:'smooth'}); } return; }
    if(S.step===1){
      if(!validate(1)){ render(); return; }
      b.disabled=true; b.textContent='กำลังเช็คห้องว่าง…';
      loadData().then(function(){
        if(S.service==='stay' && S.roomType && roomStatus(S.roomType).s==='full') S.roomType='';
        S.rooms=Math.min(S.rooms||1,S.pets); go(2);
      });
      return;
    }
    go(S.step+1); return;
  }
  if(b.dataset.go){ go(Number(b.dataset.go)); return; }
  if(b.dataset.set){
    S[b.dataset.set]=b.dataset.v;
    if(b.dataset.set==='service'){ S.addons={}; }
    S.roomType=''; render(); return;
  }
  if(b.dataset.pets){ S.pets=Math.max(1,Math.min(4,S.pets+Number(b.dataset.pets))); S.rooms=Math.min(S.rooms,S.pets); render(); return; }
  if(b.dataset.rooms){ S.rooms=Math.max(1,Math.min(S.pets,S.rooms+Number(b.dataset.rooms))); render(); return; }
  if(b.dataset.room){
    var st=roomStatus(b.dataset.room);
    S.roomType=b.dataset.room;
    if(st.free) S.rooms=Math.max(1,Math.min(S.rooms,st.free));
    S.errors={}; render(); return;
  }
  if(b.dataset.q){ var nm=b.dataset.q; S.addons[nm]=Math.max(1,Math.min(99,(S.addons[nm]||1)+Number(b.dataset.d))); render(); return; }
  if(b.dataset.copy){ copy(b.dataset.copy==='acct' ? BANK.no.replace(/-/g,'') : (S.result&&S.result.msg)||''); return; }
});
document.addEventListener('change', function(e){
  var el=e.target;
  if(el.dataset.addon!=null){
    var a=addonList().filter(function(x){return x.name===el.dataset.addon;})[0];
    if(el.checked) S.addons[a.name]=defaultQty(a); else delete S.addons[a.name];
    render(); return;
  }
  if(el.dataset.k){
    if(el.type==='checkbox') S[el.dataset.k]=el.checked; else S[el.dataset.k]=el.value;
    if(el.dataset.k==='checkIn' && S.checkIn && (!S.checkOut || S.checkOut<=S.checkIn)) S.checkOut=addDays(S.checkIn,1);
    if(['checkIn','checkOut','date','weight'].indexOf(el.dataset.k)>-1){
      // ปรับจำนวนบริการเสริมรายคืนตามจำนวนคืนใหม่
      addonList().forEach(function(a){ if(S.addons[a.name] && a.unit==='คืน') S.addons[a.name]=defaultQty(a); });
      if(S.step===1 || el.type==='checkbox') render();
    } else if(el.type==='checkbox' || el.tagName==='SELECT') { if(S.step!==4 || el.type==='checkbox') render(); }
  }
});
document.addEventListener('input', function(e){
  var el=e.target;
  if(el.dataset.k && el.type!=='checkbox' && el.tagName!=='SELECT'){ S[el.dataset.k]=el.value; }
});

// เปิดหน้าซ้ำหลังส่งแล้ว (เช่น กลับมาจาก LINE) → โชว์หน้ามัดจำเดิม
try{
  var last=JSON.parse(sessionStorage.getItem('pph_last_booking')||'null');
  if(last && Date.parse(last.holdUntil) > Date.now() - 6*3600000){ S.result=last; S.step=5; }
}catch(e){}
// โหลดข้อมูลร้านไว้ก่อน (ราคา/ห้องว่าง) — ไม่ต้องรอก็ใช้หน้าได้
loadData().then(function(){ if(S.step<4) render(); });
render();
})();
</script>
