<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จองห้องพัก | Perfect Pet House</title>
<meta name="description" content="จองโรงแรมสัตว์เลี้ยงและ Day Care ออนไลน์ เช็คห้องว่างได้ทันที Perfect Pet House วัชรพล-รามอินทรา">
<meta name="theme-color" content="#FFF8F0">
<link rel="icon" href="/images/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3A2E26; --ink-soft:#6B5B50; --muted:#8C7B6E; --line:#F3D8C2; --cream:#FFF8F0; --white:#fff;
  --brand:#B85C1E; --brand-ink:#8A4415; --brand-tint:#FCEADB; --accent:#E07B39;
  --ok:#2F6B45; --ok-tint:#E6F2EA; --full:#5E534B; --full-tint:#E9E4DF; --danger:#A33A36;
  --font:'Inter','Noto Sans Thai',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--cream);font-size:15px;line-height:1.5}
a{color:var(--brand)}a:hover{color:var(--brand-ink)}
h1,h2,h3{letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--brand-tint);color:var(--brand-ink)}
input,textarea{caret-color:var(--brand)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(184,92,30,.35);outline-offset:2px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hb{width:44px;height:44px;flex:none;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--brand-ink);display:flex;align-items:center;justify-content:center;padding:0}
.hb:active{transform:scale(.94)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:600;font-size:16px}
.brand img{width:28px;height:36px;object-fit:contain}
.top a.line{font-weight:500;font-size:14px}

.wrap{max-width:1080px;margin:0 auto;padding:0 16px 140px;display:grid;gap:28px}
@media(min-width:960px){.wrap{grid-template-columns:minmax(0,1fr) 340px;padding-bottom:60px;align-items:start}
  /* aside ยืดเต็มความสูงแถว → การ์ดสรุป (sticky) เลื่อนตามได้จริงตอนเลื่อนดูห้องยาวๆ */
  .wrap>aside{align-self:stretch;padding-top:16px}}
.progress{display:flex;gap:6px;margin:16px 0 6px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--brand)}
.stepname{font-size:13px;color:var(--ink-soft)}
.back{background:none;border:0;padding:8px 0;color:var(--brand);font-weight:500;font-size:14px;min-height:44px}
h1.t{font-size:26px;font-weight:700;margin:8px 0 4px}
.sub{color:var(--ink-soft);margin:0 0 18px}
.lbl{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);margin:0 0 6px}
.grp{margin-bottom:18px}
.seg{display:flex;gap:10px}
.seg button{flex:1;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px}
.seg button small{font-size:12px;font-weight:400;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint);color:var(--brand-ink)}
.field{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:#fff;font-size:16px}
.field:focus,.seg button:focus-visible,.btn:focus-visible{outline:3px solid rgba(184,92,30,.35);outline-offset:1px}
textarea.field{min-height:72px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hint{font-size:13px;color:var(--ink-soft);margin:6px 0 0}
.err{font-size:13px;color:var(--danger);margin:6px 0 0;font-weight:500}
.field.bad{border-color:var(--danger)}
.stepper{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px}
.stepper .ctl{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);font-size:20px}
.stepper output{min-width:40px;text-align:center;font-weight:600}
.note{display:flex;gap:10px;align-items:flex-start;background:#EEF5F0;border-radius:12px;padding:12px 14px;color:#2F5E40;font-size:14px}
.note.warn{background:var(--brand-tint);color:#5A3A22}

.rooms{display:grid;gap:14px}
.room{background:#fff;border:1.5px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
/* เลือกแล้ว: ขอบหนาขึ้นด้วย outline ด้านใน (ไม่ใช่ border) → การ์ดไม่ขยับ · เงายกตัวสีกลาง */
.room.sel{border-color:var(--brand);outline:1px solid var(--brand);outline-offset:-2.5px;box-shadow:0 8px 24px rgba(58,46,38,.12)}
.room.full{background:#F7F2EC}
.room.full img{filter:grayscale(.85);opacity:.7}
.room img{width:100%;height:160px;object-fit:cover;display:block;background:var(--brand-tint)}
.room .ph{position:relative}
.room .b{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.room .hd{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap}
.room h3{font-size:18px;font-weight:700}
.room .stepper{padding:4px 4px 4px 12px}
.room .stepper span{white-space:nowrap}
.room .stepper button{width:40px;height:40px}
/* คอลัมน์หลักกว้างพอ: การ์ดแนวนอน รูปซ้าย รายละเอียดขวา (เดิมบีบ 3 คอลัมน์ → กล่องจำนวนห้องล้นขอบ/ใบที่ 3 ตกแถว) */
@media(min-width:700px){
  .room{flex-direction:row}
  .room .ph{flex:none;width:40%;max-width:280px;min-height:200px}
  .room .ph img{position:absolute;inset:0;height:100%}
  .room .b{padding:16px 18px}
}
.pill{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:13px;font-weight:600;border-radius:999px;padding:4px 10px}
.pill.ok::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-tint);color:var(--ok)}
.pill.last{background:var(--brand-tint);color:var(--brand-ink)}
.pill.full{background:var(--full-tint);color:var(--full)}
.pill.unk{background:#EEF0F3;color:#45505C}
.feat{font-size:13px;color:var(--ink-soft)}
.price{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto}
.was{font-size:13px;color:var(--muted)}
.was s{margin-right:4px}
.big{font-size:20px;font-weight:700}
.big.deal{color:var(--brand-ink)}
.price .tot{text-align:right}
.big,.price b,.sum span:last-child,.bar .t b,.amount,.dz>button span,.stepper output{font-variant-numeric:tabular-nums}
.online{font-size:12px;font-weight:600;color:var(--brand-ink)}
.btn{min-height:48px;border-radius:12px;border:0;background:var(--brand);color:#fff;font-weight:600;font-size:15px;padding:0 18px;transition:background-color .15s,color .15s}
.btn.ghost{background:#fff;border:1.5px solid var(--brand);color:var(--brand-ink)}
.btn.line{background:#06C755;color:#0B2E17}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media(hover:hover){
  .btn:not(:disabled):hover{background:var(--brand-ink)}
  .btn.ghost:not(:disabled):hover{background:var(--brand-tint);color:var(--brand-ink)}
  .btn.line:hover{background:#05B34C}
  .seg button:hover,.addon:hover,.dz:hover,.stepper button:not(:disabled):hover{border-color:var(--accent)}
}
.upsell{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px dashed var(--accent);border-radius:14px;padding:12px 14px;margin-top:14px}

.addon{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px;min-height:64px;margin-bottom:10px;transition:border-color .15s,background-color .15s}
.addon.on{border-color:var(--brand);background:#FFF4EA}
.addon input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand);flex:none;margin:0}
.addon label{flex:1;cursor:pointer}
.addon .nm{font-weight:500}
.addon .pr{font-size:13px;color:var(--ink-soft)}
.addon .q{display:flex;align-items:center;gap:6px}
.addon .q button{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:18px}
.addon .q output{min-width:52px;text-align:center;font-size:14px;font-weight:600}
.dcz{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:-2px 0 12px}
.dz{border:1.5px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.dz.on{border-color:var(--brand);background:#FFF4EA}
.dz>button{width:100%;min-height:64px;border:0;background:none;text-align:left;padding:8px 12px;display:flex;flex-direction:column;gap:1px;font:inherit;color:inherit;cursor:pointer}
.dz>button small{font-size:12px;color:var(--ink-soft)}
.dz>button span{font-weight:600;color:var(--brand-ink)}
.dz .q{display:flex;align-items:center;justify-content:space-between;padding:0 8px 8px}
.dz .q button{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:18px}
.dz .q output{font-size:14px;font-weight:600}
@media(min-width:700px){.dcz{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* ติ๊ก Day Care วันเช็คเอาท์ → แผงเลือกไซส์ต่อจากกล่องเดียวกัน (ไม่ลอยแยก) */
.addon.open{margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
.addon-more{border:1.5px solid var(--brand);border-top:0;border-radius:0 0 14px 14px;background:#FFF4EA;padding:2px 12px 12px;margin-bottom:10px}
.addon-more .sec{font-size:15px;margin:10px 0 8px}
.addon-more .dcz{margin:10px 0 0}
.addon-more .sec+.dcz{margin-top:0}
.addon-more .dz.on{background:#fff;outline:1px solid var(--brand);outline-offset:-2.5px}
.addon-more .err{margin-top:8px}
.sec{font-size:17px;font-weight:700;margin:20px 0 10px}
.sec small{font-size:13px;font-weight:500;color:var(--ink-soft)}
.stepper button:disabled,.dz .q button:disabled{opacity:.35;cursor:not-allowed}

.policy{background:var(--brand-tint);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.6;color:#5A3A22;margin:14px 0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:10px 0}
.chk input{width:20px;height:20px;accent-color:var(--brand);margin:2px 0 0;flex:none}

.card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:18px}
.sum{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}
.sum.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-weight:600}
.sum.dep{color:var(--brand-ink);font-weight:700;font-size:16px}
.sum.muted{color:var(--ink-soft)}
aside .card{position:sticky;top:84px}
aside .btn{width:100%;margin-top:12px}
@media(max-width:959px){aside{display:none}}

.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;z-index:30}
.bar .t{flex:1;min-width:0}
.bar .t small{display:block;font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t b{font-size:19px}
.bar .btn{min-height:52px;padding:0 26px}
@media(min-width:960px){.bar{display:none}}

.done-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;margin:20px 0 16px}
.done-head .pill{align-self:center}
.done-ic{width:56px;height:56px;border-radius:50%;background:var(--ok-tint);display:flex;align-items:center;justify-content:center}
.code{font-size:18px;font-weight:700;letter-spacing:.5px;color:var(--ink)}
.amount{font-size:34px;font-weight:700;color:var(--brand-ink);text-align:center}
.acct{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--cream);border-radius:12px;padding:10px 10px 10px 14px;margin:8px 0}
.acct .no{font-size:21px;font-weight:700;letter-spacing:1px}
.steps{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.steps div{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.steps span{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:50}
</style>
</head>

};
function petTypes(){ return PETS.filter(function(p){ return S.n[p]>0; }); }
function petsTotal(){ return S.n.dog+S.n.cat; }
function isMixed(){ return petTypes().length>1; }
function petsLabel(){ return petTypes().map(function(p){ return PET_TH[p]+' '+S.n[p]+' ตัว'; }).join(' + '); }
function petName(p){ return p==='dog' ? S.nameDog : S.nameCat; }
function sizeCount(m){ var n=0; Object.keys(m||{}).forEach(function(k){ n+=m[k]; }); return n; }

// ═══ utils ═══
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function baht(n){ return '฿' + (Math.round(Number(n)*100)/100).toLocaleString('th-TH'); }
function r2(n){ return Math.round((Number(n)+Number.EPSILON)*100)/100; }
function iso(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function today(){ return iso(new Date()); }
function addDays(s,n){ var d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return iso(d); }
function nightsOf(a,b){ if(!a||!b) return 0; var n=Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); return n>0?n:0; }
function eachDate(a,b,cb){ var d=a, g=0; while(d<b && g++<400){ cb(d); d=addDays(d,1); } }
function thDate(s,withDay){ if(!s) return '-'; var d=new Date(s+'T00:00:00'); return d.toLocaleDateString('th-TH',withDay===false?{day:'numeric',month:'short'}:{weekday:'short',day:'numeric',month:'short'}); }
function toast(t){ var el=document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(function(){ el.remove(); },2200); }
function copy(t){
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){toast('คัดลอกแล้ว');},function(){fallbackCopy(t);}); return; } }catch(e){}
  fallbackCopy(t);
}
function fallbackCopy(t){ var a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand('copy'); toast('คัดลอกแล้ว');}catch(e){} a.remove(); }

// ═══ ราคา (สูตรเดียวกับ calc.js ฝั่งหลังบ้าน) ═══
function longStayPct(n){
  var t=(D.longStay||[]).slice().sort(function(a,b){return b.minNights-a.minNights;});
  for(var i=0;i<t.length;i++) if(n>=t[i].minNights) return Number(t[i].pct)||0;
  return 0;
}
function nextTier(n){
  var t=(D.longStay||[]).slice().sort(function(a,b){return a.minNights-b.minNights;});
  for(var i=0;i<t.length;i++) if(n<t[i].minNights) return t[i];
  return null;
}
function listPrice(rt,pet){ return Number(D.prices[rt] && D.prices[rt][pet]) || 0; }
function unitPrice(rt,pet){
  var o = D.online && D.online[rt] && Number(D.online[rt][pet]);
  var l = listPrice(rt,pet);
  return (o && o < l) ? o : l;
}
function dcPrice(pet,size){ return Number(D.daycare.prices[pet] && D.daycare.prices[pet][size]) || 0; }
// กลุ่มที่นับที่ว่าง Day Care (ตรงกับ daycareGroupOf หลังบ้าน): แมว · สุนัข S/M · สุนัข L/XL
function dcGroupOf(pet,size){ return pet==='cat' ? 'cat' : (size==='l'||size==='xl' ? 'dogLarge' : 'dogSmall'); }
var DC_GROUP_TH = { cat:'แมว', dogSmall:'สุนัขไซส์ S–M', dogLarge:'สุนัขไซส์ L–XL' };
function addonList(){
  return (D.addOns||[]).filter(function(a){ return !SPECIAL_ADDON.test(a.name) && (S.service==='stay' || a.unit!=='คืน'); });
}
function defaultQty(a){
  var n=nightsOf(S.checkIn,S.checkOut)||1;
  if(a.unit==='คืน') return n;
  if(a.unit==='ตัว') return petsTotal();
  return 1;
}
function totals(){
  var stay=S.service==='stay', n=stay ? nightsOf(S.checkIn,S.checkOut) : 0, pct=stay ? longStayPct(n) : 0;
  var lines=[], dcItems=[], room=0, disc=0;
  petTypes().forEach(function(p){
    if(stay){
      var r=S.room[p]; if(!r.type) return;
      var unit=unitPrice(r.type,p), gross=r2(unit*r.rooms*n);
      // ปัดส่วนลดเป็นบาทเต็มต่อรายการห้อง (หลังบ้านบันทึกส่วนลดเป็นจำนวนเงินต่อรายการ → ยอดตรงกันเป๊ะ)
      var d=pct ? Math.round(gross*pct/100) : 0;
      lines.push({ pet:p, roomType:r.type, label:D.prices[r.type].label, rooms:r.rooms, unit:unit, list:listPrice(r.type,p), gross:gross, disc:d });
      room=r2(room+gross-d); disc+=d;
    } else {
      DC_SIZES[p].forEach(function(z){
        var q=S.dc[p][z[0]]; if(!q) return;
        var u=dcPrice(p,z[0]);
        dcItems.push({ pet:p, size:z[0], unitPrice:u, count:q, total:r2(u*q) });
        room=r2(room+u*q);
      });
    }
  });
  var adds = [], addSum = 0;
  addonList().forEach(function(a){
    var q=S.addons[a.name]; if(!q) return;
    var t=r2(a.unitPrice*q); addSum=r2(addSum+t);
    adds.push({name:a.name,unitPrice:a.unitPrice,qty:q,unit:a.unit,total:t});
  });
  if(stay && S.dcOn) petTypes().forEach(function(p){
    DC_SIZES[p].forEach(function(z){
      var q=S.lateDc[p][z[0]]; if(!q) return;
      var u=dcPrice(p,z[0]), t=r2(u*q); addSum=r2(addSum+t);
      adds.push({name:'Day Care วันเช็คเอาท์ '+PET_TH[p]+' ไซส์ '+z[0].toUpperCase(),unitPrice:u,qty:q,unit:'ตัว',total:t,kind:'daycare',size:z[0],pet:p});
    });
  });
  var grand = r2(room+addSum);
  var full = !stay; // Day Care ชำระเต็มจำนวน · ฝากค้างคืนมัดจำตาม depositPct
  var dep = full ? grand : Math.round(grand*(D.depositPct==null?50:D.depositPct)/100);
  return { nights:n, pct:pct, lines:lines, disc:disc, dcItems:dcItems, room:room, addOns:adds, addSum:addSum, grand:grand, deposit:dep, balance:r2(grand-dep), full:full };
}

// ═══ ห้องว่าง ═══
function roomStatus(rt,pet){
  if(!LIVE || !D.capacity || !D.capacity[rt]) return {s:'unk'};
  var cap = Number(D.capacity[rt][pet])||0;
  if(cap<=0) return {s:'full',free:0};
  var minFree = Infinity;
  eachDate(S.checkIn, S.checkOut, function(d){
    var used = (D.used[d] && D.used[d][rt+'|'+pet]) || 0;
    HOLDS.forEach(function(h){ if(h.kind!=='daycare' && h.roomType===rt && h.pet===pet && h.checkIn<=d && d<h.checkOut) used += h.rooms||1; });
    minFree = Math.min(minFree, cap-used);
  });
  if(minFree===Infinity) minFree=cap;
  var need = S.room[pet].type===rt ? S.room[pet].rooms : 1;
  if(minFree < 1) return {s:'full',free:0};
  if(minFree < need) return {s:'full',free:minFree};
  return {s: minFree===need ? 'last' : 'ok', free:minFree};
}
// จำนวนตัวที่ต้องใช้ที่ Day Care แยกตามกลุ่ม { cat|dogSmall|dogLarge: ตัว }
function dcNeed(){
  var g={};
  petTypes().forEach(function(p){ Object.keys(S.dc[p]).forEach(function(z){ var k=dcGroupOf(p,z); g[k]=(g[k]||0)+S.dc[p][z]; }); });
  return g;
}
function dcGroupStatus(g,need){
  if(!LIVE) return {s:'unk'};
  var cap=Number((D.daycare.capacity||{})[g])||0;
  var used=(D.dcUsed[S.date] && D.dcUsed[S.date][g]) || 0;
  HOLDS.forEach(function(h){ if(h.kind==='daycare' && h.dcGroup===g && h.checkIn===S.date) used += h.count||1; });
  var free=cap-used;
  if(free < need) return {s:'full',free:Math.max(0,free)};
  return {s: free===need ? 'last':'ok', free:free};
}
function pillHtml(st){
  if(st.s==='ok') return '<span class="pill ok">ว่าง</span>';
  if(st.s==='last') return '<span class="pill last">เหลือที่สุดท้าย</span>';
  if(st.s==='full') return '<span class="pill full">เต็มช่วงวันนี้</span>';
  return '<span class="pill unk">ร้านยืนยันห้องว่างทาง LINE</span>';
}

// ═══ โหลดข้อมูลจากระบบร้าน ═══
function fval(f){
  if(!f) return null;
  if('stringValue' in f) return f.stringValue;
  if('integerValue' in f) return Number(f.integerValue);
  if('doubleValue' in f) return Number(f.doubleValue);
  if('timestampValue' in f) return f.timestampValue;
  return null;
}
function loadData(){
  var a = fetch(FS+'/publicAvailability/main?key='+KEY).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){
    var data = JSON.parse(fval(j.fields && j.fields.json) || 'null');
    if(!data || !data.prices) throw 0;
    ['prices','online','longStay','depositPct','holdHours','addOns','capacity','used','dcUsed'].forEach(function(k){ if(data[k]!=null) D[k]=data[k]; });
    if(data.daycare){ D.daycare.capacity = data.daycare.capacity || D.daycare.capacity; D.daycare.prices = data.daycare.prices || D.daycare.prices; }
    LIVE = true;
  }).catch(function(){ LIVE=false; });
  var b = fetch(FS+'/roomHolds?pageSize=300&key='+KEY).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(j){
    var now=Date.now();
    HOLDS = (j.documents||[]).map(function(doc){
      var f=doc.fields||{}, o={};
      Object.keys(f).forEach(function(k){ o[k]=fval(f[k]); });
      return o;
    }).filter(function(h){ return Date.parse(h.expiresAt) > now; });
  }).catch(function(){ HOLDS=[]; });
  return Promise.all([a,b]);
}

// ═══ ส่งคำขอจอง ═══
function genCode(){
  var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s='';
  for(var i=0;i<4;i++) s+=c[Math.floor(Math.random()*c.length)];
  return 'PPH-'+today().slice(2).replace(/-/g,'')+'-'+s;
}
function fsFields(o){
  var f={};
  Object.keys(o).forEach(function(k){
    var v=o[k];
    if(v && v.__ts) f[k]={timestampValue:v.__ts};
    else if(typeof v==='number' && Number.isInteger(v)) f[k]={integerValue:String(v)};
    else f[k]={stringValue:String(v==null?'':v)};
  });
  return {fields:f};
}
function post(col, obj){
  return fetch(FS+'/'+col+'?key='+KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(fsFields(obj))})
    .then(function(r){ if(!r.ok) throw new Error(col+' '+r.status); return r.json(); });
}
function summaryText(code,t){
  var L=['🐾 จองออนไลน์ Perfect Pet House','รหัสจอง: '+code,'──────────────',
    '👤 '+S.owner+' · 📞 '+S.phone];
  if(S.line) L.push('💬 LINE: '+S.line);
  petTypes().forEach(function(p){ L.push(PET_EMOJI[p]+' '+PET_TH[p]+' '+S.n[p]+' ตัว · ชื่อน้อง: '+(petName(p)||'-')); });
  if(S.breed) L.push('สายพันธุ์: '+S.breed);
  if(S.service==='stay'){
    t.lines.forEach(function(l){ L.push('🏨 '+l.label+' ('+PET_TH[l.pet]+') × '+l.rooms+' ห้อง · '+baht(l.unit)+'/คืน'); });
    L.push('📅 '+S.checkIn+' → '+S.checkOut+' ('+t.nights+' คืน) · มาถึง '+S.arrive+' น.');
    if(t.pct) L.push('🎁 ส่วนลดพักยาว '+t.pct+'% (-'+baht(t.disc)+')');
  } else {
    t.dcItems.forEach(function(i){ L.push('☀️ Day Care '+PET_TH[i.pet]+' ไซส์ '+i.size.toUpperCase()+' × '+i.count+' ตัว · '+baht(i.unitPrice)+'/ตัว'); });
    L.push('📅 '+S.date+' · มาถึง '+S.arrive+' น.');
  }
  t.addOns.forEach(function(a){ L.push('➕ '+a.name+' '+a.qty+' '+a.unit+' = '+baht(a.total)); });
  L.push('💰 รวม '+baht(t.grand)+(t.full?' · ชำระเต็มจำนวน':' · มัดจำ 50% '+baht(t.deposit)));
  if(S.wantGroom) L.push('✂️ อาบน้ำ/ตัดขนก่อนกลับบ้าน (คิดตามน้ำหนักที่ชั่งหน้าร้าน)');
  if(S.note) L.push('📝 '+S.note);
  return L.join('\n');
}
function submit(){
  if(S.sending) return;
  S.sending=true; render();
  var t=totals(), code=genCode(), types=petTypes();
  var holdUntil=new Date(Date.now()+(D.holdHours||2)*3600000).toISOString();
  var stay=S.service==='stay';
  var first=t.lines[0]||{}, firstDc=t.dcItems[0]||{}, need=dcNeed();
  var roomsLabel=t.lines.map(function(l){ return l.label+(isMixed()?' ('+PET_TH[l.pet]+')':''); }).join(' + ');
  var payload = {
    v:2, code:code, kind:stay?'stay':'daycare', pet:types[0], pets:petsTotal(),
    petCounts:{dog:S.n.dog,cat:S.n.cat}, petNames:{dog:S.nameDog,cat:S.nameCat},
    // หลายห้อง/หลายสัตว์: หลังบ้านใช้ lines / daycareItems เป็นหลัก · ช่องเดี่ยวด้านล่างไว้ให้โค้ดรุ่นเก่ายังอ่านได้
    lines: t.lines.map(function(l){ return {pet:l.pet,roomType:l.roomType,roomLabel:l.label,rooms:l.rooms,pricePerNight:l.unit,listPrice:l.list,longStayDisc:l.disc}; }),
    daycareItems: t.dcItems.map(function(i){ return {pet:i.pet,size:i.size,group:dcGroupOf(i.pet,i.size),unitPrice:i.unitPrice,count:i.count}; }),
    roomType:stay?first.roomType:'', roomLabel:stay?roomsLabel:'', rooms:t.lines.reduce(function(s,l){return s+l.rooms;},0),
    checkIn:stay?S.checkIn:S.date, checkOut:stay?S.checkOut:S.date, nights:t.nights,
    pricePerNight:first.unit||0, listPrice:first.list||0, longStayPct:t.pct, longStayDisc:t.disc,
    daycare: stay?null:{ size:firstDc.size||'', group:firstDc.pet?dcGroupOf(firstDc.pet,firstDc.size):'', unitPrice:firstDc.unitPrice||0, count:petsTotal() },
    addOns:t.addOns.map(function(a){ var o={name:a.name,unitPrice:a.unitPrice,qty:a.qty,unit:a.unit}; if(a.kind){ o.kind=a.kind; o.size=a.size; o.pet=a.pet; } return o; }),
    arriveTime:S.arrive, weightKg:'', wantGroom:S.wantGroom,
    depositPct:t.full?100:D.depositPct, totals:{grand:t.grand,deposit:t.deposit,balance:t.balance},
    holdUntil:holdUntil, acceptedPolicyAt:new Date().toISOString(), liveAvailability:LIVE
  };
  // กันห้อง: 1 รายการต่อแบบห้อง×ชนิดสัตว์ (Day Care = 1 รายการต่อกลุ่ม) — หลายใบใช้รหัสจองเดียวกัน
  var base = { code:code, kind:payload.kind, checkIn:payload.checkIn, checkOut:payload.checkOut, expiresAt:{__ts:holdUntil}, createdAt:new Date().toISOString() };
  var holds = stay
    ? t.lines.map(function(l){ return Object.assign({}, base, { roomType:l.roomType, pet:l.pet, rooms:l.rooms, dcGroup:'', count:S.n[l.pet] }); })
    : Object.keys(need).map(function(g){ return Object.assign({}, base, { roomType:'', pet:g==='cat'?'cat':'dog', rooms:0, dcGroup:g, count:need[g] }); });
  var msg = summaryText(code,t);
  var webData = {
    owner:S.owner, phone:S.phone, line:S.line, email:S.email,
    pet:PET_NICK[types[0]]+(isMixed()?' + '+PET_NICK[types[1]]:''),
    petname:types.map(function(p){ return petName(p)+(isMixed()?' ('+PET_TH[p]+')':''); }).join(' · '),
    breed:S.breed,
    service: stay ? 'ฝากเลี้ยง (ค้างคืน)' : 'Day Care',
    room: stay ? roomsLabel : '',
    checkin: payload.checkIn, checkout: stay ? S.checkOut : '',
    time: S.arrive, note: S.note
  };
  var holdIds=[];
  Promise.all(holds.map(function(h){
    return post('roomHolds', h).then(function(j){ var id=(j.name||'').split('/').pop(); if(id) holdIds.push(id); }).catch(function(){});
  }))
  .then(function(){
    var req = Object.assign({}, webData, { source:'/booking.html', submittedAt:new Date().toISOString(), status:'new',
      code:code, holdId:holdIds.join(','), payloadJson:JSON.stringify(payload) });
    var p1 = post('bookingRequests', req).then(function(){return true;},function(){return false;});
    // แจ้งเตือนร้าน + ลง Google Sheets + ปฏิทิน (Apps Script เดิม)
    var p2 = fetch(GAS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(Object.assign({}, webData, { message:msg, submittedAt:new Date().toLocaleString('th-TH') }))})
      .then(function(r){return r.json();}).then(function(j){ return !!(j&&j.ok); }).catch(function(){return false;});
    return Promise.all([p1,p2]);
  }).then(function(ok){
    S.sending=false;
    S.result = { code:code, t:t, holdUntil:holdUntil, msg:msg, ok:ok[0]||ok[1], held:holdIds.length>0,
      label: stay ? roomsLabel : 'Day Care', when: stay ? (thDate(S.checkIn)+' – '+thDate(S.checkOut)+' ('+t.nights+' คืน)') : thDate(S.date) };
    try{ sessionStorage.setItem('pph_last_booking', JSON.stringify(S.result)); }catch(e){}
    S.step=5; history.pushState({step:5,idx:((history.state&&history.state.idx)||0)+1},''); render(); window.scrollTo(0,0);
  });
}

// ═══ validation ═══
function validate(step){
  var e={};
  if(step===1){
    var t=today();
    if(S.service==='stay'){
      if(!S.checkIn) e.checkIn='เลือกวันเช็คอิน';
      else if(S.checkIn<t) e.checkIn='เลือกวันตั้งแต่วันนี้เป็นต้นไป';
      if(!S.checkOut) e.checkOut='เลือกวันเช็คเอาท์';
      else if(S.checkIn && S.checkOut<=S.checkIn) e.checkOut='ต้องหลังวันเช็คอินอย่างน้อย 1 คืน';
      else if(nightsOf(S.checkIn,S.checkOut)>60) e.checkOut='จองออนไลน์ได้ไม่เกิน 60 คืน — ทัก LINE ได้เลย';
    } else {
      if(!S.date) e.date='เลือกวันที่'; else if(S.date<t) e.date='เลือกวันตั้งแต่วันนี้เป็นต้นไป';
    }
  }
  if(step===2){
    if(S.service==='stay'){
      petTypes().forEach(function(p){
        var r=S.room[p];
        if(!r.type) e['room_'+p]='เลือกห้องให้'+PET_NICK[p];
        else if(roomStatus(r.type,p).s==='full') e['room_'+p]='ห้องนี้เต็มช่วงวันที่เลือก';
      });
    } else {
      petTypes().forEach(function(p){ if(sizeCount(S.dc[p])!==S.n[p]) e['dc_'+p]='เลือกไซส์ให้ครบ '+S.n[p]+' ตัว'; });
      var need=dcNeed();
      Object.keys(need).forEach(function(g){
        var st=dcGroupStatus(g,need[g]);
        if(st.s==='full') e.room='Day Care '+DC_GROUP_TH[g]+' วันนี้'+(st.free?'เหลือที่ '+st.free+' ตัว':'เต็มแล้ว')+' ลองเลือกวันอื่น';
      });
    }
  }
  if(step===3){
    if(S.service==='stay' && S.dcOn && !petTypes().some(function(p){ return sizeCount(S.lateDc[p]); })) e.dc='เลือกไซส์ตามน้ำหนักน้อง';
  }
  if(step===4){
    if(!S.owner.trim()) e.owner='กรอกชื่อของคุณ';
    var ph=S.phone.replace(/\D/g,'');
    if(ph.length<9||ph.length>10) e.phone='เบอร์โทร 9–10 หลัก';
    petTypes().forEach(function(p){ var k=p==='dog'?'nameDog':'nameCat'; if(!String(S[k]).trim()) e[k]='กรอกชื่อ'+PET_NICK[p]; });
    if(S.email && !/^\S+@\S+\.\S+$/.test(S.email)) e.email='อีเมลไม่ถูกต้อง';
    if(!S.accept) e.accept='กรุณายอมรับเงื่อนไขก่อนส่ง';
  }
  S.errors=e;
  return !Object.keys(e).length;
}
function go(n){
  if(n>S.step && !validate(S.step)){ render(); var f=document.querySelector('.err'); if(f) f.scrollIntoView({block:'center',behavior:'smooth'}); return; }
  S.errors={};
  var fwd=n>S.step; S.step=n; if(fwd) history.pushState({step:n,idx:((history.state&&history.state.idx)||0)+1},''); render(); window.scrollTo(0,0);
}

// ═══ render ═══

    '<div><span>3</span><p style="margin:3px 0 0">ร้านตรวจสลิปแล้วส่งใบยืนยันการจองให้ทาง LINE</p></div></div>'+
  '<a class="btn line" style="display:flex;align-items:center;justify-content:center;text-decoration:none;min-height:52px;font-size:17px" href="'+lineUrl+'" target="_blank" rel="noopener">ส่งสลิปทาง LINE '+LINE_OA+'</a>'+
  '<div class="card" style="margin-top:14px;font-size:14px;color:var(--ink-soft)">'+esc(r.label)+' · '+esc(r.when)+'<br>ยอดรวม '+baht(r.t.grand)+(r.t.full?' · ชำระเต็มจำนวน ไม่มียอดคงเหลือวันรับบริการ':' · ส่วนที่เหลือ '+baht(r.t.balance)+' ชำระวันเข้าพัก')+'<br>แนะนำให้แคปหน้าจอนี้เก็บไว้</div>';
}
function sumHtml(t){
  var h='<div style="font-weight:700;font-size:17px;margin-bottom:6px">สรุปการจอง</div>', mixed=isMixed();
  if(S.service==='stay'){
    if(!t.lines.length) return h+'<p class="feat" style="margin:0">'+(S.checkIn&&S.checkOut?thDate(S.checkIn,false)+' – '+thDate(S.checkOut,false)+' · '+nightsOf(S.checkIn,S.checkOut)+' คืน':'เลือกวันที่และห้อง')+'</p>';
    t.lines.forEach(function(l){
      h+='<div class="sum"><span>'+esc(l.label)+(mixed?' ('+PET_TH[l.pet]+')':'')+' '+baht(l.unit)+' × '+t.nights+' คืน'+(l.rooms>1?' × '+l.rooms+' ห้อง':'')+'</span><span>'+baht(l.gross)+'</span></div>';
    });
    if(t.pct) h+='<div class="sum" style="color:var(--ok)"><span>ส่วนลดพักยาว '+t.pct+'%</span><span>-'+baht(t.disc)+'</span></div>';
  } else {
    if(!t.dcItems.length) return h+'<p class="feat" style="margin:0">'+(S.date?thDate(S.date)+' · ':'')+petsLabel()+'</p>';
    t.dcItems.forEach(function(i){
      h+='<div class="sum"><span>Day Care '+PET_TH[i.pet]+' ไซส์ '+i.size.toUpperCase()+' '+baht(i.unitPrice)+' × '+i.count+' ตัว</span><span>'+baht(i.total)+'</span></div>';
    });
  }
  t.addOns.forEach(function(a){ h+='<div class="sum"><span>'+esc(a.name)+' × '+a.qty+' '+esc(a.unit)+'</span><span>'+baht(a.total)+'</span></div>'; });
  if(S.wantGroom) h+='<div class="sum muted"><span>อาบน้ำ/ตัดขน</span><span>คิดตามน้ำหนักหน้าร้าน</span></div>';
  h+='<div class="sum tot"><span>รวมทั้งหมด</span><span>'+baht(t.grand)+'</span></div>';
  if(t.full) h+='<div class="sum dep"><span>ชำระเต็มจำนวนตอนนี้</span><span>'+baht(t.deposit)+'</span></div>';
  else h+='<div class="sum dep"><span>มัดจำ 50% ตอนนี้</span><span>'+baht(t.deposit)+'</span></div>'+
     '<div class="sum muted"><span>ชำระวันเข้าพัก</span><span>'+baht(t.balance)+'</span></div>';
  return h;
}
function nextLabel(){
  return ['', 'ดูห้องว่าง', 'ถัดไป', 'ถัดไป', S.sending?'กำลังส่ง…':'ส่งคำขอจอง'][S.step];
}
function render(){
  var t=totals(), stay=S.service==='stay';
  $('main').innerHTML = [null,step1,step2,step3,step4,step5][S.step]();
  var bar=$('bar'), aside=$('aside');
  if(S.step===5){ bar.classList.add('hidden'); aside.innerHTML=S.result?'<div style="font-weight:700">'+esc(S.result.code)+'</div><p class="feat">'+(S.result.t.full?'โอนเงิน':'โอนมัดจำ')+'แล้วส่งสลิปทาง LINE '+LINE_OA+'</p>':''; return; }
  bar.classList.remove('hidden');
  var small = S.step===1 ? (stay ? 'เลือกวันเข้า–ออก' : 'Day Care') :
    (stay ? (t.lines.length ? t.lines.map(function(l){return l.label;}).filter(function(x,i,a){return a.indexOf(x)===i;}).join(' + ')+' · '+t.nights+' คืน' : 'ยังไม่ได้เลือกห้อง') : 'Day Care · '+petsTotal()+' ตัว');
  var showTotal = S.step>1 && (stay ? t.lines.length>0 : t.dcItems.length>0);
  bar.innerHTML='<div class="t"><small>'+esc(small)+(S.step===4&&showTotal?(t.full?' · ชำระเต็มจำนวน':' · มัดจำ '+baht(t.deposit)):'')+'</small><b>'+(showTotal?baht(t.grand):'')+'</b></div>'+
    '<button class="btn" data-next'+(S.sending?' disabled':'')+'>'+nextLabel()+'</button>';
  // ช่องที่กรอกไม่ผ่าน: ขอบแดง + aria-invalid (ข้อความ error อยู่ใต้ช่องอยู่แล้ว)
  Object.keys(S.errors).forEach(function(k){
    var f=document.querySelector('main .field[data-k="'+k+'"]');
    if(f){ f.classList.add('bad'); f.setAttribute('aria-invalid','true'); }
  });
  aside.innerHTML = sumHtml(t)+'<button class="btn" data-next'+(S.sending?' disabled':'')+'>'+nextLabel()+'</button>'+
    '<p class="feat" style="margin:10px 0 0">เช็คอิน 9:00–18:00 น. · เช็คเอาท์ภายใน 14:00 น.</p>';
}

// ═══ events (delegation) ═══
function clearMap(m){ Object.keys(m).forEach(function(k){ delete m[k]; }); }
document.addEventListener('click', function(e){
  var b=e.target.closest('button,[data-copy]'); if(!b) return;
  if(b.hasAttribute('data-next')){
    if(S.step===4){ if(validate(4)) submit(); else { render(); var f=document.querySelector('.err'); if(f) f.scrollIntoView({block:'center',behavior:'smooth'}); } return; }
    if(S.step===1){
      if(!validate(1)){ render(); return; }
      b.disabled=true; b.textContent='กำลังเช็คห้องว่าง…';
      loadData().then(function(){
        if(S.service==='stay'){
          var p0=petTypes()[0];
          if(PRE_ROOM && !S.room[p0].type){ S.room[p0].type=PRE_ROOM; } PRE_ROOM='';
          petTypes().forEach(function(p){
            var r=S.room[p];
            r.rooms=Math.max(1,Math.min(r.rooms||1,S.n[p]));
            if(r.type && roomStatus(r.type,p).s==='full') r.type='';
          });
        }
        go(2);
      });
      return;
    }
    go(S.step+1); return;
  }
  if(b.dataset.go){ var gn=Number(b.dataset.go); if(gn===S.step-1){ stepBack(); } else { go(gn); } return; }
  if(b.dataset.set){
    S[b.dataset.set]=b.dataset.v;
    if(b.dataset.set==='service'){ S.addons={}; S.dcOn=false; PETS.forEach(function(p){ clearMap(S.lateDc[p]); clearMap(S.dc[p]); }); }
    PETS.forEach(function(p){ S.room[p].type=''; });
    render(); return;
  }
  if(b.dataset.pn){
    var pp=b.dataset.pn, nn=Math.max(0,Math.min(MAX_PER_PET,S.n[pp]+Number(b.dataset.d)));
    if(nn+S.n[pp==='dog'?'cat':'dog']<1) return; // ต้องมีน้องอย่างน้อย 1 ตัว
    S.n[pp]=nn;
    var rr=S.room[pp]; rr.rooms=Math.max(1,Math.min(rr.rooms,nn||1)); if(!nn) rr.type='';
    if(sizeCount(S.dc[pp])>nn) clearMap(S.dc[pp]);
    if(sizeCount(S.lateDc[pp])>nn) clearMap(S.lateDc[pp]);
    render(); return;
  }
  if(b.dataset.rooms){ var rp=S.room[b.dataset.pet]; rp.rooms=Math.max(1,Math.min(S.n[b.dataset.pet],rp.rooms+Number(b.dataset.rooms))); render(); return; }
  if(b.dataset.room){
    var pet=b.dataset.pet, st=roomStatus(b.dataset.room,pet), sr=S.room[pet];
    sr.type=b.dataset.room;
    if(st.free) sr.rooms=Math.max(1,Math.min(sr.rooms,st.free));
    delete S.errors['room_'+pet]; render(); return;
  }
  if(b.hasAttribute('data-same')){ S.room.cat.type=S.room.dog.type; delete S.errors.room_cat; render(); return; }
  if(b.dataset.zk){
    var zp=b.dataset.zp, m=sizeMap(b.dataset.zk,zp), cnt=S.n[zp];
    if(b.dataset.z){
      var z=b.dataset.z;
      if(cnt===1){ clearMap(m); m[z]=1; }                  // ตัวเดียว = เลือกได้ไซส์เดียว
      else if(m[z]) delete m[z];                          // หลายตัว = กดซ้ำเพื่อเอาไซส์นี้ออก
      else if(sizeCount(m)<cnt) m[z]=1;
      else { toast('เลือกครบ '+cnt+' ตัวแล้ว — ลดไซส์อื่นก่อน'); return; }
    } else {
      var zq=b.dataset.zq, nq=(m[zq]||0)+Number(b.dataset.d);
      if(nq<=0) delete m[zq]; else if(sizeCount(m)-(m[zq]||0)+nq<=cnt) m[zq]=nq;
    }
    S.errors={}; render(); return;
  }
  if(b.dataset.q){ var nm=b.dataset.q; S.addons[nm]=Math.max(1,Math.min(99,(S.addons[nm]||1)+Number(b.dataset.d))); render(); return; }
  if(b.dataset.copy){ copy(b.dataset.copy==='acct' ? BANK.no.replace(/-/g,'') : (S.result&&S.result.msg)||''); return; }
});
document.addEventListener('change', function(e){
  var el=e.target;
  if(el.dataset.dc!=null){
    S.dcOn=el.checked; if(!S.dcOn) PETS.forEach(function(p){ clearMap(S.lateDc[p]); });
    S.errors={}; render(); return;
  }
  if(el.dataset.addon!=null){
    var a=addonList().filter(function(x){return x.name===el.dataset.addon;})[0];
    if(el.checked) S.addons[a.name]=defaultQty(a); else delete S.addons[a.name];
    render(); return;
  }
  if(el.dataset.k){
    if(el.type==='checkbox') S[el.dataset.k]=el.checked; else S[el.dataset.k]=el.value;
    if(el.dataset.k==='checkIn' && S.checkIn && (!S.checkOut || S.checkOut<=S.checkIn)) S.checkOut=addDays(S.checkIn,1);
    if(['checkIn','checkOut','date'].indexOf(el.dataset.k)>-1){
      // ปรับจำนวนบริการเสริมรายคืนตามจำนวนคืนใหม่
      addonList().forEach(function(a){ if(S.addons[a.name] && a.unit==='คืน') S.addons[a.name]=defaultQty(a); });
      if(S.step===1 || el.type==='checkbox') render();
    } else if(el.type==='checkbox' || el.tagName==='SELECT') { if(S.step!==4 || el.type==='checkbox') render(); }
  }
});
document.addEventListener('input', function(e){
  var el=e.target;
  if(el.dataset.k && el.type!=='checkbox' && el.tagName!=='SELECT'){ S[el.dataset.k]=el.value; if(el.classList.contains('bad')){ el.classList.remove('bad'); el.removeAttribute('aria-invalid'); } }
});

// เปิดหน้าซ้ำหลังส่งแล้ว (เช่น กลับมาจาก LINE) → โชว์หน้ามัดจำเดิม
try{
  var last=JSON.parse(sessionStorage.getItem('pph_last_booking')||'null');
  if(last && Date.parse(last.holdUntil) > Date.now() - 6*3600000){ S.result=last; S.step=5; }
}catch(e){}
// ลิงก์จากหน้าแรก: ?service=daycare &pet=cat &room=vip &groom=1
var PRE_ROOM='';
try{
  var qs=new URLSearchParams(location.search);
  if(qs.get('service')==='daycare') S.service='daycare';
  if(qs.get('pet')==='cat') S.n={dog:0,cat:1};
  if(/^(cozy|deluxe|vip)$/.test(qs.get('room')||'')) PRE_ROOM=qs.get('room');
  if(qs.get('groom')==='1') S.wantGroom=true;
}catch(e){}
// โหลดข้อมูลร้านไว้ก่อน (ราคา/ห้องว่าง) — ไม่ต้องรอก็ใช้หน้าได้
loadData().then(function(){ if(S.step<4) render(); });
var FINAL=5;
try{ history.replaceState({step:S.step,idx:0},''); }catch(e){}
// ── ปุ่มย้อนกลับ (หัวหน้า) + ปุ่ม back ของมือถือ ──
// แต่ละขั้นมีประวัติในเบราว์เซอร์ → ปัดย้อนกลับ/กดปุ่ม back ของ Android แล้วถอยทีละขั้น ไม่หลุดออกจากหน้าจอง
function leavePage(){
  try{ if(document.referrer && new URL(document.referrer).origin===location.origin && history.length>1){ history.go(-(((history.state&&history.state.idx)||0)+1)); return; } }catch(e){}
  location.href='/';
}
function stepBack(){
  if(S.step>1 && S.step<FINAL && history.state && history.state.step===S.step){ history.back(); return; }
  if(S.step>1 && S.step<FINAL){ go(S.step-1); return; }
  leavePage();
}
window.addEventListener('popstate', function(e){
  if(S.result && S.step===FINAL){ location.href='/'; return; }
  var n=(e.state && e.state.step) || 1;
  if(n<S.step){ S.errors={}; S.step=n; render(); window.scrollTo(0,0); }
});
document.getElementById('hdrBack').addEventListener('click', stepBack);
render();
})();
</script>
</body>
</html>
