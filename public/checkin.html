<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F0">
<meta name="robots" content="noindex,nofollow">
<title>ลงทะเบียนเข้าพัก | Perfect Pet House</title>
<meta name="description" content="แบบฟอร์มลงทะเบียนข้อมูลสัตว์เลี้ยงก่อนเข้าพักโรงแรม Perfect Pet House — กรอกครั้งเดียวได้หลายตัว">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#E07B39; --orange-dark:#B85C1E; --orange-light:#FCEADB;
    --cream:#FFF8F0; --brown:#3A2E26; --brown-soft:#6B5B50; --white:#FFFFFF;
    --green:#5B8A6B; --red:#C0553B; --line:#EBDDCD;
    --shadow:0 8px 24px rgba(58,46,38,0.10); --shadow-sm:0 4px 12px rgba(58,46,38,0.08);
    --foot-h:78px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none!important;}
  body{background:var(--cream);font-family:'Inter','Noto Sans Thai',sans-serif;color:var(--brown);line-height:1.6;font-size:15px;}
  h1,h2,h3,h4{font-family:'Inter','Noto Sans Thai',sans-serif;font-weight:600;line-height:1.3;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;color:var(--brown);}
  a{color:var(--orange-dark);}

  /* ── Header + progress ── */
  .topbar{position:sticky;top:0;z-index:20;background:var(--cream);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;}
  .topbar .brand{display:flex;align-items:center;gap:9px;font-family:'Inter','Noto Sans Thai';font-weight:600;font-size:16px;}
  .topbar .brand .logo{height:38px;width:auto;flex-shrink:0;}
  .prog-meta{display:flex;justify-content:space-between;align-items:baseline;margin:11px 2px 6px;}
  .prog-meta .step-title{font-family:'Inter','Noto Sans Thai';font-weight:500;font-size:14.5px;color:var(--brown);}
  .prog-meta .step-count{font-size:12.5px;color:var(--brown-soft);}
  .prog-track{height:7px;background:var(--orange-light);border-radius:99px;overflow:hidden;}
  .prog-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-dark));border-radius:99px;
    width:0;transition:width .35s cubic-bezier(.4,0,.2,1);}

  /* ── Layout ── */
  .wrap{max-width:640px;margin:0 auto;padding:18px 16px calc(var(--foot-h) + 24px);}
  .intro-hero{text-align:center;padding:18px 6px 0;}
  .intro-hero .logo-hero{display:block;width:112px;height:auto;margin:0 auto 18px;}
  .intro-hero h1{font-size:25px;color:var(--brown);letter-spacing:-0.01em;margin-bottom:10px;text-wrap:balance;}
  .intro-hero p{color:var(--brown-soft);font-size:15px;max-width:400px;margin:0 auto;text-wrap:pretty;}
  .intro-hero .time{display:inline-block;margin-top:12px;font-size:13px;font-weight:500;color:var(--orange-dark);
    background:var(--orange-light);padding:4px 12px;border-radius:99px;}
  .intro-points{list-style:none;margin:26px 0 0;background:var(--white);border:1px solid var(--line);
    border-radius:18px;box-shadow:var(--shadow-sm);padding:4px 18px;}
  .intro-points li{display:flex;gap:12px;align-items:flex-start;padding:14px 0;}
  .intro-points li + li{border-top:1px solid var(--line);}
  .intro-points svg{width:19px;height:19px;color:var(--orange-dark);flex-shrink:0;margin-top:2px;}
  .intro-points b{font-family:'Inter','Noto Sans Thai';font-weight:600;font-size:14.5px;display:block;color:var(--brown);}
  .intro-points span{font-size:13.5px;color:var(--brown-soft);}
  .btn-start{display:block;width:100%;min-height:54px;margin-top:22px;border-radius:15px;background:var(--orange-dark);
    color:#fff;font-weight:600;font-size:16px;box-shadow:0 6px 16px rgba(184,92,30,.22);transition:transform .15s ease,box-shadow .15s ease;}
  .btn-start:active{transform:translateY(1px);box-shadow:0 3px 8px rgba(184,92,30,.2);}
  .btn-start:focus-visible,.btn-clear:focus-visible{outline:3px solid var(--orange);outline-offset:3px;}
  .btn-clear{display:block;margin:14px auto 0;padding:8px 12px;font-size:13.5px;color:var(--brown-soft);
    text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);}

  .card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:17px 16px;
    box-shadow:var(--shadow-sm);margin-bottom:15px;}
  .card > h2{font-size:16.5px;color:var(--brown);margin-bottom:3px;display:flex;align-items:center;gap:8px;}
  .card > .sub{font-size:12.5px;color:var(--brown-soft);margin-bottom:14px;}
  .card .ic-badge{width:30px;height:30px;border-radius:9px;background:var(--orange-light);color:var(--orange-dark);
    display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}

  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .field > label{display:block;font-family:'Inter','Noto Sans Thai';font-weight:500;font-size:14px;margin-bottom:7px;color:var(--brown);}
  .field .en{color:var(--brown-soft);font-weight:400;font-size:12px;font-family:'Inter','Noto Sans Thai';}
  .field .req{color:var(--red);margin-left:2px;}
  .field .hint{font-size:12px;color:var(--brown-soft);margin-top:5px;display:block;}
  .inp,textarea.inp,select.inp{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;
    background:var(--cream);transition:border-color .15s,background .15s;}
  .inp:focus,textarea.inp:focus{outline:none;border-color:var(--orange);background:#fff;}
  textarea.inp{resize:vertical;min-height:64px;line-height:1.5;}
  .field.invalid .inp,.field.invalid .opts{border-color:var(--red);}
  .field.invalid > label{color:var(--red);}
  .err-msg{display:none;color:var(--red);font-size:12px;margin-top:5px;}
  .field.invalid .err-msg{display:block;}

  /* ── Choice pills (radio / checkbox) ── */
  .opts{display:flex;flex-wrap:wrap;gap:8px;}
  .opts.col{flex-direction:column;}
  .opt-pill{display:flex;align-items:center;gap:8px;padding:11px 14px;border:1.5px solid var(--line);
    border-radius:12px;background:var(--cream);font-size:14px;transition:all .15s;flex:0 0 auto;line-height:1.25;}
  .opts.col .opt-pill{width:100%;}
  .opt-pill input{position:absolute;opacity:0;pointer-events:none;}
  .opt-pill .dot{width:19px;height:19px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .opt-pill.check .dot{border-radius:6px;}
  .opt-pill.sel{border-color:var(--orange);background:var(--orange-light);font-weight:500;}
  .opt-pill.sel .dot{border-color:var(--orange-dark);background:var(--orange-dark);}
  .opt-pill.sel .dot::after{content:'';width:8px;height:8px;border-radius:inherit;background:#fff;}
  .opt-other-txt{margin-top:8px;}
  .opt-other-txt[hidden]{display:none;}

  /* ── Pet header + actions ── */
  .pet-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,var(--orange),var(--orange-dark));
    color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:15px;box-shadow:var(--shadow-sm);}
  .pet-banner .pt{font-family:'Inter','Noto Sans Thai';font-weight:600;font-size:16px;display:flex;align-items:center;gap:9px;}
  .pet-banner .pt .n{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;
    align-items:center;justify-content:center;font-size:15px;}
  .pet-del{background:rgba(255,255,255,.18);color:#fff;font-size:12.5px;padding:7px 11px;border-radius:9px;font-family:'Inter','Noto Sans Thai';}
  .copy-prev{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--orange-dark);
    background:var(--orange-light);padding:6px 11px;border-radius:9px;font-family:'Inter','Noto Sans Thai';font-weight:500;margin-top:9px;}
  .add-pet-btn{width:100%;padding:14px;border:2px dashed var(--orange);border-radius:15px;background:var(--orange-light);
    color:var(--orange-dark);font-family:'Inter','Noto Sans Thai';font-weight:500;font-size:14.5px;display:flex;align-items:center;
    justify-content:center;gap:8px;margin-top:4px;}

  /* ── Rules box (consent) ── */
  .rules-box{max-height:280px;overflow-y:auto;border:1.5px solid var(--line);border-radius:14px;padding:14px 15px;
    background:var(--cream);font-size:13.5px;line-height:1.65;-webkit-overflow-scrolling:touch;}
  .rules-box h3{font-size:14.5px;color:var(--orange-dark);margin:14px 0 5px;}
  .rules-box h3:first-child{margin-top:0;}
  .rules-box h4{font-size:13.5px;margin:9px 0 3px;color:var(--brown);}
  .rules-box ul{margin:0 0 4px;padding-left:19px;}
  .rules-box li{margin-bottom:3px;}
  .rules-box .lead{color:var(--brown-soft);font-size:12.5px;margin-bottom:6px;}
  .consent-check{display:flex;gap:11px;align-items:flex-start;background:var(--orange-light);border:1.5px solid var(--orange);
    border-radius:14px;padding:14px;margin-top:15px;cursor:pointer;}
  .consent-check input{position:absolute;opacity:0;}
  .consent-check .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--orange-dark);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;background:#fff;transition:all .15s;margin-top:1px;}
  .consent-check.on .box{background:var(--orange-dark);}
  .consent-check.on .box::after{content:'✓';color:#fff;font-weight:700;font-size:15px;}
  .consent-check .txt{font-size:14px;font-family:'Inter','Noto Sans Thai';font-weight:500;}

  /* ── Review ── */
  .rev-group{margin-bottom:13px;}
  .rev-group .rg-h{font-family:'Inter','Noto Sans Thai';font-weight:500;font-size:13px;color:var(--orange-dark);text-transform:uppercase;
    letter-spacing:.3px;margin-bottom:7px;display:flex;align-items:center;gap:7px;}
  .rev-row{display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .rev-row:last-child{border-bottom:none;}
  .rev-row .k{color:var(--brown-soft);flex-shrink:0;}
  .rev-row .v{text-align:right;font-weight:500;word-break:break-word;}
  .rev-edit{font-size:12.5px;color:var(--orange-dark);background:var(--orange-light);padding:5px 11px;border-radius:8px;font-family:'Inter','Noto Sans Thai';}
  .rev-pet-card{border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:11px;background:var(--cream);}
  .rev-pet-card .rp-name{font-family:'Inter','Noto Sans Thai';font-weight:600;font-size:14.5px;margin-bottom:8px;color:var(--brown);
    display:flex;align-items:center;gap:8px;}

  #status{text-align:center;font-size:14px;margin:6px 0 2px;min-height:20px;font-family:'Inter','Noto Sans Thai';font-weight:500;}
  .line-fallback{display:none;margin-top:12px;}
  .line-fallback.show{display:block;}
  .line-btn{width:100%;padding:14px;border-radius:14px;background:#06C755;color:#fff;font-family:'Inter','Noto Sans Thai';
    font-weight:500;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;}

  /* ── Success ── */
  .success{text-align:center;padding:26px 8px;}
  .success .tick{width:82px;height:82px;border-radius:50%;background:var(--green);color:#fff;font-size:42px;
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:var(--shadow);}
  .success h1{font-size:23px;color:var(--brown);margin-bottom:8px;}
  .success p{color:var(--brown-soft);font-size:14.5px;max-width:420px;margin:0 auto 6px;}
  .success .reg{display:inline-block;margin-top:12px;background:var(--orange-light);color:var(--orange-dark);
    font-family:'Inter','Noto Sans Thai';font-weight:600;padding:8px 16px;border-radius:11px;font-size:14px;}
  .success .home-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:24px;
    padding:14px 26px;border-radius:14px;background:var(--orange-dark);color:#fff;font-family:'Inter','Noto Sans Thai';font-weight:500;font-size:15px;text-decoration:none;}

  /* ── Footer nav ── */
  .footnav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--white);border-top:1px solid var(--line);
    padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:11px;max-width:640px;margin:0 auto;}
  .footnav button{flex:1;padding:15px;border-radius:15px;font-family:'Inter','Noto Sans Thai';font-weight:500;font-size:15px;
    display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s,filter .12s;}
  .footnav button:active{transform:scale(.98);}
  .btn-back{background:var(--orange-light);color:var(--orange-dark);flex:0 0 40%;}
  .btn-next{background:var(--orange-dark);color:#fff;}
  .btn-next.submit{background:var(--green);}
  .footnav.single .btn-back{display:none;}

  .draft-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--foot-h) + 14px);
    background:var(--brown);color:#fff;font-size:12.5px;padding:8px 15px;border-radius:99px;z-index:30;
    opacity:0;transition:opacity .3s;pointer-events:none;font-family:'Inter','Noto Sans Thai';}
  .draft-toast.show{opacity:.94;}

  /* ── ยินยอม PDPA + อ่านกฎครบ ── */
  .consent-check + .consent-check{margin-top:10px;}
  .consent-check .txt small{display:block;font-weight:400;font-size:12.5px;color:var(--brown-soft);margin-top:3px;line-height:1.55;}
  .consent-check.pdpa{background:#fff;border-color:var(--line);}
  .consent-check.pdpa.on{background:var(--orange-light);border-color:var(--orange);}
  .consent-check:focus-visible{outline:2px solid var(--orange-dark);outline-offset:2px;}
  .rules-progress{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--brown-soft);margin-top:9px;font-weight:500;}
  .rules-progress.done{color:var(--green);}
  .rules-progress svg{width:16px;height:16px;}

  /* ── แนบบัตร + รูปน้อง ── */
  .slot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;
    border:2px dashed #E3C9AE;border-radius:15px;background:var(--cream);color:var(--orange-dark);text-align:center;}
  .slot:focus-visible{outline:2px solid var(--orange-dark);outline-offset:2px;}
  .slot svg{width:26px;height:26px;}
  .slot b{font-weight:500;font-size:14px;color:var(--brown);}
  .slot span.s{font-size:12px;color:var(--brown-soft);}
  .slot.id{aspect-ratio:1.586;}
  .slot.filled{border:0;background:var(--line);overflow:hidden;}
  .slot.filled img{width:100%;height:100%;object-fit:cover;display:block;}
  .slot.busy{opacity:.6;}
  .slot .x{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(58,46,38,.72);color:#fff;display:grid;place-items:center;}
  .slot .x svg{width:15px;height:15px;}
  .slot .redo{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.92);color:var(--brown);font-size:12.5px;
    font-weight:500;padding:6px 11px;border-radius:9px;display:flex;align-items:center;gap:5px;}
  .slot .redo svg{width:14px;height:14px;}
  .ok-line{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--green);font-weight:500;margin-top:8px;}
  .ok-line svg{width:16px;height:16px;flex-shrink:0;}
  .tips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .tips span{font-size:12px;background:var(--cream);border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--brown-soft);}
  .pet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .pet-grid .slot{aspect-ratio:1;}
  .pet-grid .slot svg{width:22px;height:22px;}
  .pet-grid .slot b{font-size:12.5px;}
  .pet-tag{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.94);color:var(--brown);font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:7px;}
  .field.invalid .slot{border-color:var(--red);}

  /* ── เซ็นรับทราบ ── */
  .pledge{background:var(--cream);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:13.5px;line-height:1.7;}
  .pledge b{color:var(--orange-dark);font-weight:600;}
  .pad{position:relative;margin-top:14px;height:210px;border:1.5px solid var(--line);border-radius:16px;background:#fff;
    box-shadow:inset 0 2px 6px rgba(58,46,38,.05);touch-action:none;overflow:hidden;}
  .field.invalid .pad{border-color:var(--red);}
  .pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  .pad .base{position:absolute;left:22px;right:22px;bottom:52px;border-bottom:1.5px dashed #D9C3AC;pointer-events:none;}
  .pad .xmark{position:absolute;left:22px;bottom:58px;font-size:15px;color:#C9AE93;font-weight:600;pointer-events:none;}
  .pad .ph{position:absolute;left:0;right:0;bottom:20px;text-align:center;font-size:12.5px;color:var(--brown-soft);pointer-events:none;}
  .pad-acts{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px;color:var(--brown-soft);}
  .pad-acts button{display:inline-flex;align-items:center;gap:6px;background:var(--orange-light);color:var(--orange-dark);font-weight:500;font-size:13px;padding:8px 13px;border-radius:10px;}
  .pad-acts button svg{width:15px;height:15px;}

  /* ── ตรวจทาน: เอกสาร & ลายเซ็น ── */
  .rev-docs{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:8px;}
  .rev-docs .th{border-radius:11px;overflow:hidden;aspect-ratio:1;background:var(--line);}
  .rev-docs .th.id{aspect-ratio:auto;}
  .rev-docs .th img{width:100%;height:100%;object-fit:cover;display:block;}
  .rev-sig{margin-top:10px;border:1.5px dashed var(--line);border-radius:12px;padding:6px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .rev-sig img{height:56px;max-width:55%;object-fit:contain;}
  .rev-sig small{font-size:12px;color:var(--brown-soft);text-align:right;line-height:1.5;}
  .rev-miss{font-size:13px;color:var(--red);}
  .done-list{list-style:none;max-width:340px;margin:18px auto 0;text-align:left;display:grid;gap:8px;}
  .done-list li{display:flex;gap:9px;align-items:center;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 13px;}
  .done-list svg{width:18px;height:18px;color:var(--green);flex-shrink:0;}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cam" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-id" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="11" r="2"/><path d="M5 16c.6-1.4 1.7-2 3-2s2.4.6 3 2M14 10h4M14 13h3"/></symbol>

  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="m8 12.5 2.6 2.6L16 9.6"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>

<header class="topbar">

  // ── ส่งสำเนาเข้าระบบภายในร้าน (Firestore ของแอปจอง) — fire-and-forget
  //    ไม่กระทบการส่งเข้า Google Sheets เดิม ถ้าล้มเหลวลูกค้าไม่เห็นอะไรผิดปกติ
  var PPH_APP_INBOX = 'https://firestore.googleapis.com/v1/projects/pph-booking/databases/(default)/documents/checkinForms?key=AIzaSyCi7sSXV0Sz85XqWI0hVTGw-BbNd8Cxox0';
  // คืน Promise — รูปบัตร/รูปน้อง/ลายเซ็นมีที่เดียวคือที่นี่ (ไม่ส่งเข้า Google Sheet) จึงต้องรู้ผลว่าส่งสำเร็จไหม
  function sendToInternalApp(payload, m){
    var sv = function(v){ return {stringValue:v||''}; };
    return fetch(PPH_APP_INBOX,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:{
        raw:{stringValue:JSON.stringify(payload)},
        ref:{stringValue:payload.ref||''},
        name:{stringValue:(payload.owner&&payload.owner.fullname)||''},
        phone:{stringValue:(payload.owner&&payload.owner.phone)||''},
        checkIn:{stringValue:(payload.stay&&payload.stay.checkin)||''},
        checkOut:{stringValue:(payload.stay&&payload.stay.checkout)||''},
        petCount:{integerValue:String((payload.pets&&payload.pets.length)||0)},
        bookingId:{stringValue:payload.bookingId||''},
        submittedAt:{stringValue:new Date().toISOString()},
        status:{stringValue:'new'},
        signOwner:sv(m.sign),
        signedOnlineAt:sv(m.signedAt),
        idPhoto:sv(m.id),
        petPhotos:{arrayValue:{values:m.pets.map(sv)}},
        consentPdpa:{booleanValue:!!payload.consent.pdpa}
      }})}).then(function(r){ if(!r.ok) throw new Error('inbox '+r.status); });
  }
  var LINE_URL = 'https://line.me/R/ti/p/@perfectbkk';
  var DRAFT_KEY = 'pph_checkin_draft_v1';
  // รหัสใบจอง (bookingId) จากลิงก์ที่พนักงานส่งให้ ?b=... → แนบกลับเพื่อให้แอปจับคู่ใบจองอัตโนมัติ
  var BOOKING_ID = (function(){ try { return new URLSearchParams(location.search).get('b') || ''; } catch(e){ return ''; } })();

  // ── ตัวเลือก (ไทย / อังกฤษ ตามฟอร์มต้นฉบับ) ──
  var OPT = {
    species:['สุนัข / Dog','แมว / Cat'],
    gender:['ชาย / Male','หญิง / Female'],
    neutered:['ทำแล้ว / Yes','ยังไม่ได้ทำ / No','ไม่แน่ใจ / Unsure'],
    health:['ปกติสุขภาพดี / Healthy','มีโรคประจำตัว / Chronic Condition','อยู่ระหว่างการรักษา / Under Treatment'],
    vaccine:['ทันสมัยครบถ้วน / Up-to-date','ฉีดบางส่วน / Partially','ยังไม่ได้ฉีด / Not Vaccinated','ไม่แน่ใจ / Unsure'],
    flea:['ทำแล้ว / Done (ภายใน 30 วัน)','ยังไม่ได้ทำ / Not Done','ไม่แน่ใจ / Unsure'],
    temperament:['เชื่องและเป็นมิตร / Friendly','ขี้อาย/ตกใจง่าย / Shy','ชอบเล่น / Playful','เฉื่อยชา / Calm','ก้าวร้าว / Aggressive','ไม่แน่นอน / Unpredictable'],
    socialize:['เข้ากันได้ดี / Gets Along Well','พอทนได้ / Tolerates','ไม่ชอบสัตว์อื่น / Dislikes Others'],
    behaviors:['เห่า/ร้องมาก / Excessive Barking','ชอบขุดคุ้ย / Digging','พยายามหนี / Escape Artist','กลัวเสียงดัง / Noise Phobia','แยกตัวไม่ได้ / Separation Anxiety','ชอบกินสิ่งของ / Chews Non-food'],
    meals:['1 มื้อ / 1 Meal','2 มื้อ / 2 Meals','3 มื้อ / 3 Meals','ให้ตลอดวัน / Free Feeding'],
    allergyFlag:['ไม่มี / None','มี (โปรดระบุ) / Yes'],
    room:['ห้อง Cozy','ห้อง Deluxe','ห้อง VIP'],
    items:['อาหาร / Food','ขนม / Treats','ยา / Medication','ของเล่น / Toys','ที่นอน / Bedding','เสื้อผ้า / Clothing','อุปกรณ์พิเศษ / Special Equipment']
  };

  // ── State ──
  var owner = {fullname:'',nickname:'',idcard:'',phone:'',line:'',email:'',address:'',emgName:'',emgPhone:''};
  var stay  = {checkin:'',checkinTime:'',checkout:'',checkoutTime:'',specialRequest:''};
  var consent = {agreed:false, pdpa:false, signName:''};
  // รูป/ลายเซ็น (data URL) — ไม่เก็บลงร่าง localStorage เพราะใหญ่เกิน 5MB ได้ · กลับมากรอกต่อต้องแนบใหม่
  var media = {id:'', pets:[], sign:'', signedAt:''};

  var sentInternal = false; // ส่งเข้าระบบร้านสำเร็จแล้ว → กดส่งซ้ำ (หลัง Apps Script ล้ม) จะไม่สร้างใบซ้ำ
  function blankPet(){return {name:'',species:'',breed:'',gender:'',age:'',weight:'',microchip:'',neutered:'',
    health:'',disease:'',medication:'',vaccine:'',vaccineDate:'',flea:'',temperament:[],socialize:'',behaviors:[],
    stressTriggers:'',behaviorNote:'',meals:'',feedTime:'',amount:'',allergyFlag:'',allergyList:'',supplements:'',
    room:'',items:[],itemsDetail:''};}
  var pets = [blankPet()];
  var started = false;
  var cur = 0; // index in screens[]

  var $ = function(id){return document.getElementById(id);};
  var esc = function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};

  function screens(){
    var arr = ['owner'];
    for(var i=0;i<pets.length;i++) arr.push('pet:'+i);
    arr.push('stay','consent','docs','sign','review');
    return arr;
  }
  function screenTitle(s){
    if(s==='owner') return 'ข้อมูลเจ้าของ';
    if(s.indexOf('pet:')===0){var i=+s.split(':')[1];return 'ข้อมูลน้อง (ตัวที่ '+(i+1)+'/'+pets.length+')';}
    if(s==='stay') return 'วันเข้าพัก & ห้อง';
    if(s==='consent') return 'ยินยอม & ข้อตกลง';
    if(s==='docs') return 'แนบบัตร & รูปน้อง';
    if(s==='sign') return 'เซ็นรับทราบ';
    if(s==='review') return 'ตรวจทาน & ส่ง';
    return '';
  }

  // ── ตัวช่วยสร้าง choice ──
  function pills(name,val,options,multi,extraOther){
    var vals = multi ? (val||[]) : [val];
    var h = '';
    options.forEach(function(o){
      var on = vals.indexOf(o)>=0;
      h += '<label class="opt-pill'+(multi?' check':'')+(on?' sel':'')+'" data-name="'+name+'" data-val="'+esc(o)+'">'+
           '<input type="'+(multi?'checkbox':'radio')+'" name="'+name+'" value="'+esc(o)+'"'+(on?' checked':'')+'>'+
           '<span class="dot"></span><span>'+esc(o)+'</span></label>';
    });
    if(extraOther){
      var otherVal = otherValueOf(val,options,multi);
      var on = otherVal!=='';
      h += '<label class="opt-pill'+(multi?' check':'')+(on?' sel':'')+'" data-name="'+name+'" data-val="__other__" data-other="1">'+
           '<input type="'+(multi?'checkbox':'radio')+'" name="'+name+'" value="__other__"'+(on?' checked':'')+'>'+
           '<span class="dot"></span><span>อื่นๆ / Other</span></label>';
    }
    return '<div class="opts col" data-group="'+name+'"'+(multi?' data-multi="1"':'')+(extraOther?' data-other="1"':'')+'>'+h+'</div>'+
      (extraOther ? '<input class="inp opt-other-txt" data-other-for="'+name+'" placeholder="ระบุอื่นๆ..." value="'+esc(otherValueOf(val,options,multi))+'"'+(otherValueOf(val,options,multi)?'':' hidden')+'>' : '');
  }
  function otherValueOf(val,options,multi){
    if(multi){ var extra=(val||[]).filter(function(v){return options.indexOf(v)<0;}); return extra.join(', '); }
    return (val && options.indexOf(val)<0) ? val : '';
  }

  function field(labelHtml,inner,opts){
    opts = opts||{};
    return '<div class="field" data-fkey="'+(opts.key||'')+'"'+(opts.req?' data-req="1"':'')+'>'+
      '<label>'+labelHtml+(opts.req?'<span class="req">*</span>':'')+'</label>'+inner+
      (opts.hint?'<span class="hint">'+opts.hint+'</span>':'')+
      '<span class="err-msg">'+(opts.err||'กรุณากรอกข้อมูลนี้')+'</span></div>';
  }
  function lbl(th,en){return esc(th)+(en?' <span class="en">/ '+esc(en)+'</span>':'');}
  function inp(key,val,type,ph){return '<input class="inp" data-k="'+key+'" type="'+(type||'text')+'" value="'+esc(val)+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>';}
  function ta(key,val,ph){return '<textarea class="inp" data-k="'+key+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>'+esc(val)+'</textarea>';}

  // ═══════ RENDERERS ═══════
  function renderIntro(){
    $('progMeta').hidden = true; $('progTrack').hidden = true; $('footnav').hidden = true;
    $('screen').innerHTML =
      '<div class="intro-hero">'+
        '<img class="logo-hero" src="images/logo-mark.png" alt="Perfect Pet House" width="211" height="192">'+
        '<h1>ลงทะเบียนข้อมูลก่อนเข้าพัก</h1>'+
        '<p>กรอกข้อมูลน้องหมาน้องแมวให้ครบก่อนวันเข้าพัก เพื่อให้ทีมงานเตรียมการดูแลได้ดีที่สุด</p>'+
        '<span class="time">ใช้เวลาประมาณ 3–5 นาที</span>'+
      '</div>'+
      '<ul class="intro-points">'+
        [['มีหลายตัว? กรอกครั้งเดียวจบ','เพิ่มน้องได้ไม่จำกัด ข้อมูลเจ้าของกรอกแค่ครั้งเดียว'],
         ['เตรียมบัตรประชาชน + รูปน้อง','ถ่ายรูปและเซ็นรับทราบบนมือถือได้เลย วันเข้าพักไม่ต้องเซ็นเอกสารที่ร้าน'],
         ['กรอกค้างไว้ได้','ระบบบันทึกร่างอัตโนมัติ กลับมากรอกต่อได้ (ยกเว้นเลขบัตร)'],
         ['ข้อมูลปลอดภัย','ส่งตรงถึงทีมงาน Perfect Pet House เท่านั้น']
        ].map(function(p){ return '<li><svg aria-hidden="true"><use href="#i-check"/></svg><div><b>'+p[0]+'</b><span>'+p[1]+'</span></div></li>'; }).join('')+
      '</ul>'+
      '<button class="btn-start" id="startBtn">เริ่มกรอกข้อมูล ›</button>'+
      (hasDraft()?'<button class="btn-clear" id="clearDraftBtn">ล้างร่างที่บันทึกไว้ แล้วเริ่มใหม่</button>':'');
    $('startBtn').onclick = function(){started=true;cur=0;render();};
    var cd = $('clearDraftBtn'); if(cd) cd.onclick = function(){clearDraft();location.reload();};
  }

  function renderOwner(){
    return '<div class="card">'+
      '<h2><span class="ic-badge">👤</span>ข้อมูลเจ้าของสัตว์เลี้ยง</h2>'+
      '<div class="sub">Owner Information · กรอกครั้งเดียวสำหรับน้องทุกตัว</div>'+
      field(lbl('ชื่อ-นามสกุล','Full Name'), inp('fullname',owner.fullname), {key:'fullname',req:1}) +
      field(lbl('ชื่อเล่น','Nickname'), inp('nickname',owner.nickname), {key:'nickname'}) +
      field(lbl('เลขบัตรประชาชน / พาสปอร์ต','ID / Passport'), inp('idcard',owner.idcard,'text','เพื่อยืนยันตัวตนผู้ฝาก'),
        {key:'idcard',req:1,hint:'🔒 เก็บเป็นความลับ ใช้ยืนยันตัวตนเจ้าของเท่านั้น'}) +
      field(lbl('เบอร์โทรศัพท์','Phone'), inp('phone',owner.phone,'tel'), {key:'phone',req:1}) +

        field(lbl('เพศ','Gender'), pills('gender',p.gender,OPT.gender,false,false), {key:'gender',req:1}) +
        field(lbl('อายุ','Age'), inp('age',p.age,'text','เช่น 2 ปี / 8 เดือน'), {key:'age',req:1}) +
        field(lbl('น้ำหนัก (กก.)','Weight'), inp('weight',p.weight,'text','เช่น 5.5'), {key:'weight'}) +
        field(lbl('หมายเลข Microchip','ถ้ามี'), inp('microchip',p.microchip), {key:'microchip'}) +
        field(lbl('ทำหมันแล้วหรือยัง','Neutered / Spayed'), pills('neutered',p.neutered,OPT.neutered,false,false), {key:'neutered',req:1}) +

        field(lbl('ยาที่ต้องกินระหว่างพัก','Medication'), ta('medication',p.medication,'ชื่อยา · ปริมาณ · เวลาให้'), {key:'medication'}) +

      // 5. อาหาร

  function renderReview(){
    var h = '<div class="card"><h2><span class="ic-badge">✅</span>ตรวจทานข้อมูลก่อนส่ง</h2>'+
      '<div class="sub">Review · แตะ "แก้ไข" เพื่อกลับไปแก้จุดที่ต้องการ</div>';
    // owner
    h += '<div class="rev-group"><div class="rg-h">👤 เจ้าของ <button class="rev-edit" data-go="owner">แก้ไข</button></div>'+
      revRow('ชื่อ', owner.fullname+(owner.nickname?' ('+owner.nickname+')':'')) +
      revRow('เลขบัตร', maskId(owner.idcard)) +
      revRow('โทร', owner.phone+(owner.line?' · '+owner.line:'')) +
      (owner.email?revRow('อีเมล', owner.email):'') +
      revRow('ฉุกเฉิน', owner.emgName+' · '+owner.emgPhone) + '</div>';
    // stay
    h += '<div class="rev-group"><div class="rg-h">📅 วันเข้าพัก <button class="rev-edit" data-go="stay">แก้ไข</button></div>'+
      revRow('เข้าพัก', (stay.checkin||'-')+(stay.checkinTime?' '+stay.checkinTime:'')) +
      revRow('ออก', (stay.checkout||'-')+(stay.checkoutTime?' '+stay.checkoutTime:'')) +
      (stay.specialRequest?revRow('พิเศษ', stay.specialRequest):'') + '</div>';
    // pets
    h += '<div class="rev-group"><div class="rg-h">🐾 สัตว์เลี้ยง '+pets.length+' ตัว</div>';
    pets.forEach(function(p,i){
      h += '<div class="rev-pet-card"><div class="rp-name"><span>'+(i+1)+'. '+esc(p.name||'(ยังไม่ตั้งชื่อ)')+'</span>'+
        '<button class="rev-edit" data-go="pet:'+i+'" style="margin-left:auto;">แก้ไข</button></div>'+
        revRow('ชนิด/พันธุ์', [p.species,p.breed,p.gender,p.age].filter(Boolean).join(' · ')) +
        revRow('ห้อง', p.room||'-') +
        revRow('วัคซีน', (p.vaccine||'-')) +
        revRow('สุขภาพ', (p.health||'-')+(p.disease?' · '+p.disease:'')) +
        revRow('อาหาร', [p.meals,p.allergyFlag&&p.allergyFlag.indexOf('มี')===0?('แพ้: '+p.allergyList):''].filter(Boolean).join(' · ')) +
        '</div>';
    });
    h += '<button class="add-pet-btn" id="addPetReview">➕ เพิ่มสัตว์เลี้ยงอีกตัว</button>';
    h += '</div>';
    // เอกสาร & ลายเซ็น
    h += '<div class="rev-group"><div class="rg-h">🪪 เอกสาร & ลายเซ็น <button class="rev-edit" data-go="docs">แก้ไข</button></div>';
    if(media.id || media.pets.length){
      h += '<div class="rev-docs">'+(media.id?'<div class="th id"><img src="'+media.id+'" alt="รูปบัตร"></div>':'')+
        media.pets.slice(0,2).map(function(src){return '<div class="th"><img src="'+src+'" alt="รูปน้อง"></div>';}).join('')+'</div>';
    }
    h += media.sign
      ? '<div class="rev-sig"><img src="'+media.sign+'" alt="ลายเซ็น"><small>ยอมรับกฎระเบียบแล้ว<br>เซ็น '+esc(thDateTime(media.signedAt))+'</small></div>'
      : '';
    if(!media.id || !media.pets.length || !media.sign) h += '<p class="rev-miss">ยังแนบรูป/เซ็นไม่ครบ — กด "ส่งข้อมูล" ระบบจะพาไปขั้นที่ยังขาด</p>';
    h += '</div>';
    h += '<div class="card"><div id="status">ตรวจสอบข้อมูลครบแล้ว กด "ส่งข้อมูล" ด้านล่างได้เลย</div>'+
      '<div class="line-fallback" id="lineFallback">'+
        '<p style="font-size:13px;color:var(--brown-soft);text-align:center;margin-bottom:10px;">ระบบอัตโนมัติขัดข้อง — เราคัดลอกสรุปให้แล้ว กรุณาวางในแชท LINE เพื่อยืนยัน</p>'+
        '<button class="line-btn" id="lineBtn">📋 วางใน LINE @perfectbkk</button></div>'+
      '</div>';
    return h;
  }
  function revRow(k,v){return '<div class="rev-row"><span class="k">'+esc(k)+'</span><span class="v">'+esc(v||'-')+'</span></div>';}
  function maskId(id){id=String(id||'');if(id.length<=4)return id;return id.slice(0,-4).replace(/[0-9A-Za-z]/g,'x')+id.slice(-4);}

  // ═══════ RENDER + WIRE ═══════
  function render(){
    if(!started){renderIntro();return;}
    var sc = screens(), s = sc[cur];
    $('progMeta').hidden=false; $('progTrack').hidden=false; $('footnav').hidden=false;
    var html;
    if(s==='owner') html=renderOwner();
    else if(s.indexOf('pet:')===0) html=renderPet(+s.split(':')[1]);
    else if(s==='stay') html=renderStay();
    else if(s==='consent') html=renderConsent();
    else if(s==='docs') html=renderDocs();
    else if(s==='sign') html=renderSign();
    else html=renderReview();
    $('screen').innerHTML = html;
    window.scrollTo(0,0);

    // progress
    $('stepTitle').textContent = screenTitle(s);
    $('stepCount').textContent = 'ขั้นที่ '+(cur+1)+' / '+sc.length;
    $('progFill').style.width = ((cur+1)/sc.length*100)+'%';

    // footer
    var foot = $('footnav'); foot.classList.toggle('single', cur===0);
    var next = $('btnNext');
    if(s==='review'){next.textContent='ส่งข้อมูล ✓';next.classList.add('submit');}
    else{next.textContent='ถัดไป ›';next.classList.remove('submit');}

    wireScreen(s);
  }

  function wireScreen(s){
    // choice pills
    $('screen').querySelectorAll('.opts').forEach(function(grp){
      var multi = grp.getAttribute('data-multi');
      grp.querySelectorAll('.opt-pill').forEach(function(pill){
        pill.addEventListener('click', function(e){
          e.preventDefault();
          if(multi){ pill.classList.toggle('sel'); pill.querySelector('input').checked = pill.classList.contains('sel'); }
          else{ grp.querySelectorAll('.opt-pill').forEach(function(x){x.classList.remove('sel');x.querySelector('input').checked=false;});
                pill.classList.add('sel'); pill.querySelector('input').checked=true; }
          // toggle "other" textbox
          var name = grp.getAttribute('data-group');
          var otherTxt = $('screen').querySelector('.opt-other-txt[data-other-for="'+name+'"]');
          if(otherTxt){
            var otherSel = grp.querySelector('.opt-pill[data-other] input');
            otherTxt.hidden = !(otherSel && otherSel.checked);
            if(!otherTxt.hidden) otherTxt.focus();
          }
          clearInvalid(pill.closest('.field'));
          scheduleSave();
        });
      });
    });
    // consent checkbox
    [['consentBox','agreed'],['pdpaBox','pdpa']].forEach(function(x){
      var cb = $(x[0]); if(!cb) return;
      var toggle = function(){ cb.classList.toggle('on'); var on = cb.classList.contains('on');
        cb.querySelector('input').checked = on; cb.setAttribute('aria-checked', String(on)); consent[x[1]] = on;
        clearInvalid($('screen').querySelector('[data-fkey="'+x[1]+'"]')); scheduleSave(); };
      cb.addEventListener('click', function(e){ e.preventDefault(); toggle(); });
      cb.addEventListener('keydown', function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); toggle(); } });
    });
    // อ่านกฎครบ = เลื่อนกล่องกฎถึงล่างสุด (แค่บอกสถานะ ไม่บังคับ)
    var rb = $('screen').querySelector('.rules-box'), rp = $('rulesProg');
    if(rb && rp){ var chk = function(){ if(rb.scrollTop + rb.clientHeight >= rb.scrollHeight - 8){ rp.classList.add('done'); rp.querySelector('span').textContent='อ่านครบแล้ว'; } };
      rb.addEventListener('scroll', chk, {passive:true}); chk(); }
    if(s==='docs') wireDocs();
    if(s==='sign') wireSign();
    // text inputs autosave
    $('screen').querySelectorAll('.inp').forEach(function(el){
      el.addEventListener('input', function(){ clearInvalid(el.closest('.field')); scheduleSave(); });
    });
    // pet actions
    var add = $('addPetBtn'); if(add) add.onclick = function(){ if(!validate(screens()[cur]))return; readCurrent();
      var i=+screens()[cur].split(':')[1]; pets.splice(i+1,0,blankPet()); cur = cur+1; save(); render(); };
    var del = $('delPet'); if(del) del.onclick = function(){ var i=+screens()[cur].split(':')[1];
      if(pets.length<=1)return; if(!confirm('ลบข้อมูลน้องตัวที่ '+(i+1)+'?'))return;
      pets.splice(i,1); if(cur>=screens().length-3 && i>=pets.length){} cur=Math.min(cur, screens().length-1); save(); render(); };
    var copyR = $('copyPrevRoom'); if(copyR) copyR.onclick = function(e){ e.preventDefault(); var i=+screens()[cur].split(':')[1];
      readCurrent(); pets[i].room = pets[i-1].room; render(); };
    var addR = $('addPetReview'); if(addR) addR.onclick = function(){ pets.push(blankPet()); cur = 1+ (pets.length-1); save(); render(); };
    // review edit jump
    $('screen').querySelectorAll('.rev-edit').forEach(function(b){ b.onclick=function(){ var go=b.getAttribute('data-go');
      var sc=screens(); for(var k=0;k<sc.length;k++){if(sc[k]===go){cur=k;break;}} render(); }; });
    // submit / line fallback wiring on review
    if(s==='review'){ var lb=$('lineBtn'); if(lb) lb.onclick=function(){ openLine(); }; }
  }

  // ═══════ READ current screen → state ═══════
  function readCurrent(){
    var s = screens()[cur];
    if(s==='owner') readInto(owner);
    else if(s.indexOf('pet:')===0) readPet(+s.split(':')[1]);
    else if(s==='stay') readInto(stay);
    else if(s==='consent'){ var cb=$('consentBox'); if(cb) consent.agreed=cb.classList.contains('on'); var pb=$('pdpaBox'); if(pb) consent.pdpa=pb.classList.contains('on'); }
  }
  function readInto(obj){
    $('screen').querySelectorAll('.inp[data-k]').forEach(function(el){ obj[el.getAttribute('data-k')] = el.value.trim(); });
    // choice groups
    $('screen').querySelectorAll('.opts[data-group]').forEach(function(grp){
      var name=grp.getAttribute('data-group'); if(!(name in obj))return;
      obj[name]=readGroup(grp);
    });
  }
  function readPet(i){
    var p=pets[i]; readInto(p);
    // ensure arrays for multi
    ['temperament','behaviors','items'].forEach(function(k){ var grp=$('screen').querySelector('.opts[data-group="'+k+'"]'); if(grp)p[k]=readGroup(grp,true); });
  }
  function readGroup(grp,forceArr){
    var multi = grp.getAttribute('data-multi') || forceArr;
    var name = grp.getAttribute('data-group');
    var otherTxt = $('screen').querySelector('.opt-other-txt[data-other-for="'+name+'"]');
    var otherVal = otherTxt && !otherTxt.hidden ? otherTxt.value.trim() : '';
    if(multi){
      var out=[]; grp.querySelectorAll('.opt-pill').forEach(function(pill){
        if(pill.querySelector('input').checked){ if(pill.getAttribute('data-other')){ if(otherVal)out.push(otherVal); } else out.push(pill.getAttribute('data-val')); }
      }); return out;
    }else{
      var sel=grp.querySelector('.opt-pill input:checked'); if(!sel)return '';
      var pill=sel.closest('.opt-pill'); if(pill.getAttribute('data-other')) return otherVal||'อื่นๆ';
      return pill.getAttribute('data-val');
    }
  }

  // ═══════ VALIDATE ═══════
  var REQ = {
    owner:['fullname','idcard','phone','emgName','emgPhone'],
    pet:['name','species','breed','gender','age','neutered','health','vaccine','meals','allergyFlag','room'],
    stay:['checkin','checkout'],
    consent:['agreed','pdpa'],
    docs:['idPhoto','petPhotos'],
    sign:['signature']
  };
  function validate(s){
    var need;
    if(s==='owner') need=REQ.owner;
    else if(s.indexOf('pet:')===0) need=REQ.pet;
    else if(s==='stay') need=REQ.stay;
    else if(s==='consent') need=REQ.consent;
    else if(s==='docs') need=REQ.docs;
    else if(s==='sign') need=REQ.sign;
    else return true;
    readCurrent();
    var firstBad=null;
    // clear
    $('screen').querySelectorAll('.field').forEach(function(f){f.classList.remove('invalid');});
    need.forEach(function(k){
      var val = getVal(s,k), bad=false;
      if(k==='agreed') bad = !consent.agreed;
      else if(k==='pdpa') bad = !consent.pdpa;
      else if(k==='idPhoto') bad = !media.id;
      else if(k==='petPhotos') bad = !media.pets.length;
      else if(k==='signature') bad = !media.sign;
      else bad = !val || (val.length===0);
      if(bad){ var f=$('screen').querySelector('.field[data-fkey="'+k+'"]'); if(f){f.classList.add('invalid'); if(!firstBad)firstBad=f;} }
    });
    if(firstBad){ firstBad.scrollIntoView({behavior:'smooth',block:'center'}); return false; }
    return true;
  }
  function getVal(s,k){
    if(s==='owner')return owner[k]; if(s==='stay')return stay[k];
    if(s==='consent')return k==='agreed'?consent.agreed:consent[k];
    if(s.indexOf('pet:')===0)return pets[+s.split(':')[1]][k];
    return '';
  }
  function clearInvalid(f){if(f)f.classList.remove('invalid');}

  // ═══════ NAV ═══════
  $('btnNext').onclick = function(){
    var s = screens()[cur];
    if(s==='review'){
      // กลับมาจากร่าง (รูป/ลายเซ็นไม่ถูกเก็บในร่าง) → พากลับไปขั้นที่ยังขาด
      var miss = !consent.agreed||!consent.pdpa ? 'consent' : (!media.id||!media.pets.length) ? 'docs' : !media.sign ? 'sign' : '';
      if(miss){ cur = screens().indexOf(miss); render(); validate(miss); return; }
      submit(); return;
    }
    if(!validate(s)) return;
    readCurrent(); save();
    cur = Math.min(cur+1, screens().length-1); render();
  };
  $('btnBack').onclick = function(){ readCurrent(); save(); if(cur>0){cur--;render();} else {started=false;render();} };

  // ═══════ AUTOSAVE (ยกเว้นเลขบัตร) ═══════
  var saveTimer=null;
  function scheduleSave(){ if(saveTimer)clearTimeout(saveTimer); saveTimer=setTimeout(function(){readCurrent();save();showToast();},600); }
  function save(){
    try{
      var o={}; for(var k in owner) if(k!=='idcard') o[k]=owner[k];
      localStorage.setItem(DRAFT_KEY, JSON.stringify({owner:o,stay:stay,consent:consent,pets:pets,cur:cur,started:started,ts:Date.now()}));
    }catch(e){}
  }
  function hasDraft(){ try{return !!localStorage.getItem(DRAFT_KEY);}catch(e){return false;} }
  function loadDraft(){
    try{
      var d=JSON.parse(localStorage.getItem(DRAFT_KEY)); if(!d)return false;
      for(var k in d.owner) owner[k]=d.owner[k];
      if(d.stay)for(var k2 in d.stay)stay[k2]=d.stay[k2];
      if(d.consent){consent.agreed=!!d.consent.agreed;consent.pdpa=!!d.consent.pdpa;consent.signName=d.consent.signName||'';}
      if(d.pets&&d.pets.length)pets=d.pets;
      return true;
    }catch(e){return false;}
  }
  function clearDraft(){try{localStorage.removeItem(DRAFT_KEY);}catch(e){}}
  var toastTimer=null;
  function showToast(){var t=$('draftToast');t.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},1400);}

  // ═══════ รูป + ลายเซ็น ═══════
  var TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  function thDate(iso){ if(!iso) return '-'; var d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.getDate()+' '+TH_MON[d.getMonth()]+' '+(d.getFullYear()+543); }
  function thDateTime(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return '';
    var p=function(n){return (n<10?'0':'')+n;}; return d.getDate()+' '+TH_MON[d.getMonth()]+' '+(d.getFullYear()+543)+' · '+p(d.getHours())+':'+p(d.getMinutes())+' น.'; }

  // ย่อรูปบนเครื่องลูกค้า: ด้านยาว ≤ maxSide · ลด quality จนไม่เกิน maxChars (สูตรเดียวกับ compressImage ในแอปร้าน)
  function shrinkImage(file, maxSide, maxChars, cb){
    var rd = new FileReader();
    rd.onerror = function(){ cb(''); };
    rd.onload = function(){
      var img = new Image();
      img.onerror = function(){ cb(''); };
      img.onload = function(){
        var w=img.width, h=img.height, sc=Math.min(1, maxSide/Math.max(w,h));
        var cv=document.createElement('canvas'); cv.width=Math.round(w*sc); cv.height=Math.round(h*sc);
        var cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height);
        var q=0.78, out=cv.toDataURL('image/jpeg',q);
        while(out.length>maxChars && q>0.35){ q-=0.1; out=cv.toDataURL('image/jpeg',q); }
        cb(out);
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  }
  // กันเอกสารเกินลิมิต Firestore 1MB: รวมรูปทั้งหมด ≤ ~800k ตัวอักษร — เกินก็ย่อรูปน้องซ้ำ
  function fitMedia(){
    return new Promise(function(resolve){
      var total = function(){ return media.id.length + media.sign.length + media.pets.reduce(function(a,x){return a+x.length;},0); };
      if(total() <= 800*1024) return resolve(media);
      var i = 0;
      (function step(){
        if(total() <= 800*1024 || i >= media.pets.length) return resolve(media);
        var im = new Image(); im.onload = function(){
          var cv=document.createElement('canvas'); var sc=Math.min(1, 720/Math.max(im.width,im.height));
          cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
          cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); media.pets[i]=cv.toDataURL('image/jpeg',0.55); i++; step(); };
        im.onerror = function(){ i++; step(); };
        im.src = media.pets[i];
      })();
    });
  }
  function wireDocs(){
    var input = $('filePick'), target = '';
    $('screen').querySelectorAll('[data-pick]').forEach(function(b){ b.onclick = function(){ target = b.getAttribute('data-pick');
      input.value=''; input.click(); }; });
    input.onchange = function(){
      var f = input.files && input.files[0]; if(!f) return;
      var slot = $('screen').querySelector('[data-pick="'+target+'"]'); if(slot) slot.classList.add('busy');
      shrinkImage(f, target==='id'?1200:1000, 160*1024, function(url){
        if(!url){ alert('อ่านรูปนี้ไม่ได้ ลองเลือกรูปอื่น'); render(); return; }
        if(target==='id') media.id = url; else if(media.pets.length<MAX_PET_PHOTOS) media.pets.push(url);
        render();
      });
    };
    $('screen').querySelectorAll('[data-del]').forEach(function(b){ b.onclick = function(){ var k=b.getAttribute('data-del');
      if(k==='id') media.id=''; else media.pets.splice(+k.split(':')[1],1); render(); }; });
  }
  function wireSign(){
    var cv = $('signCanvas'), pad = $('signPad'); if(!cv) return;
    var dpr = window.devicePixelRatio || 1, ctx = cv.getContext('2d'), drawing = false, inked = false, last = null;
    var size = function(){ var r = pad.getBoundingClientRect(); cv.width = Math.round(r.width*dpr); cv.height = Math.round(r.height*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1d2a6b'; };
    size();
    if(media.sign){ var im=new Image(); im.onload=function(){ var r=pad.getBoundingClientRect(); ctx.drawImage(im,0,0,r.width,r.height); }; im.src=media.sign; inked=true; }
    var pt = function(e){ var r = cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
    cv.addEventListener('pointerdown', function(e){ e.preventDefault(); drawing=true; last=pt(e); cv.setPointerCapture(e.pointerId);
      ctx.beginPath(); ctx.arc(last.x,last.y,1.2,0,Math.PI*2); ctx.fillStyle='#1d2a6b'; ctx.fill(); });
    cv.addEventListener('pointermove', function(e){ if(!drawing) return; e.preventDefault(); var p=pt(e);
      ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; inked=true; $('signPh').hidden=true; });
    var end = function(){ if(!drawing) return; drawing=false; if(!inked) return;
      media.sign = exportSign(cv); media.signedAt = new Date().toISOString();
      $('signTime').textContent = thDateTime(media.signedAt); clearInvalid($('screen').querySelector('[data-fkey="signature"]')); };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
    $('signClear').onclick = function(){ ctx.clearRect(0,0,cv.width,cv.height); inked=false; media.sign=''; media.signedAt='';
      $('signPh').hidden=false; $('signTime').textContent=''; };
  }
  // ลายเซ็นเป็น PNG พื้นขาว กว้าง ≤ 600px (พิมพ์ชัด ไฟล์เล็ก)
  function exportSign(cv){
    var sc = Math.min(1, 600/cv.width), out = document.createElement('canvas');
    out.width = Math.round(cv.width*sc); out.height = Math.round(cv.height*sc);
    var c = out.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,out.width,out.height); c.drawImage(cv,0,0,out.width,out.height);
    return out.toDataURL('image/png');
  }

  // ═══════ SUBMIT ═══════
  // รหัสการจองเดียว ใช้ร่วมทุกระบบ (แอปภายใน + Google Sheet + อีเมล + เอกสารพิมพ์)
  // รูปแบบ PPH-YYMMDD-HHMM สร้างจากเวลาที่กดส่ง
  function makeRef(d){
    d = d || new Date();
    var p = function(n){ return (n<10?'0':'')+n; };
    return 'PPH-'+p(d.getFullYear()%100)+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());
  }
  var payloadRef = null;
  function buildPayload(){
    // ชื่อผู้ลงนาม = ชื่อเจ้าของ (มีลายเซ็นจริงแทนช่องพิมพ์ชื่อแล้ว) · Apps Script ยังอ่าน signName เหมือนเดิม
    consent.signName = owner.fullname;
    consent.signedAt = media.signedAt;
    return { type:'checkin', ref:makeRef(), submittedAt:new Date().toLocaleString('th-TH'),
      bookingId:BOOKING_ID, owner:owner, stay:stay, consent:consent, pets:pets };
  }
  function summaryForLine(){
    var L=['🏨 ลงทะเบียนเข้าพัก Perfect Pet House','เจ้าของ: '+owner.fullname+' · โทร '+owner.phone,
      'เข้าพัก: '+stay.checkin+(stay.checkinTime?' '+stay.checkinTime:'')+' → ออก: '+stay.checkout+(stay.checkoutTime?' '+stay.checkoutTime:''),
      'สัตว์ '+pets.length+' ตัว:'];
    pets.forEach(function(p,i){L.push((i+1)+') '+p.name+' · '+p.species+' · '+p.breed+' · ห้อง '+(p.room||'-'));});
    return L.join('\n');
  }
  function openLine(){
    try{ if(navigator.clipboard) navigator.clipboard.writeText(summaryForLine()); }catch(e){}
    setTimeout(function(){ window.open(LINE_URL,'_blank'); }, 500);
  }
  function submit(){
    var st=$('status'); var next=$('btnNext');
    function setSt(m,c){ if(st){st.textContent=m; st.style.color=c||'var(--brown-soft)';} }
    if(!payloadRef) payloadRef = buildPayload(); // ref เดิมเมื่อกดส่งซ้ำ
    var payload = payloadRef;
    next.disabled=true; setSt('กำลังส่งข้อมูล รูป และลายเซ็น...','var(--brown-soft)');
    // 1) ระบบร้าน (มีรูป+ลายเซ็น) ต้องสำเร็จก่อน — ล้มเหลวให้ลูกค้ากดส่งใหม่ ไม่ปล่อยลายเซ็นหายเงียบ
    var internal = sentInternal ? Promise.resolve() : fitMedia().then(function(m){ return sendToInternalApp(payload, m); }).then(function(){ sentInternal = true; });
    internal.then(function(){
      if(!CHECKIN_SCRIPT_URL || CHECKIN_SCRIPT_URL.indexOf('http')!==0){ clearDraft(); renderSuccess(payload.ref); return; }
      // 2) Google Sheet + อีเมล — ไม่มีรูป (เซลล์ชีตรับได้ ~50k ตัวอักษร) ส่งแค่สถานะ
      var light = JSON.parse(JSON.stringify(payload));
      light.docs = { hasIdPhoto: !!media.id, petPhotoCount: media.pets.length, signedOnline: !!media.sign, signedAt: media.signedAt };
      return fetch(CHECKIN_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(light)})
        .then(function(r){return r.json();})
        .then(function(j){ clearDraft(); renderSuccess((j&&j.ok&&j.regId)||payload.ref); })
        // ข้อมูลถึงร้านแล้ว (ขั้น 1) — ชีต/อีเมลล้มก็ไม่ต้องให้ลูกค้าทำอะไรเพิ่ม
        .catch(function(){ clearDraft(); renderSuccess(payload.ref); });
    }).catch(function(){
      next.disabled=false;
      setSt('⚠ ส่งรูป/ลายเซ็นไม่สำเร็จ — ตรวจสัญญาณเน็ตแล้วกด "ส่งข้อมูล" อีกครั้ง','var(--orange-dark)');
      $('lineFallback').classList.add('show');
    });
  }
  function renderSuccess(regId){
    $('progMeta').hidden=true; $('progTrack').hidden=true; $('footnav').hidden=true;
    $('progFill').style.width='100%';
    $('screen').innerHTML='<div class="success">'+
      '<div class="tick">✓</div>'+
      '<h1>ส่งข้อมูลเรียบร้อย!</h1>'+
      '<p>ขอบคุณที่ไว้วางใจให้ Perfect Pet House ดูแลน้องๆ วันเข้าพักพาน้องมาส่งได้เลย ไม่ต้องกรอกหรือเซ็นเอกสารที่ร้านอีก</p>'+
      (regId?'<span class="reg">รหัสลงทะเบียน: '+esc(regId)+'</span>':'')+
      '<ul class="done-list">'+
        '<li><svg><use href="#i-check"/></svg>ข้อมูลน้อง '+pets.length+' ตัว</li>'+
        '<li><svg><use href="#i-check"/></svg>ยอมรับกฎระเบียบ + เซ็นรับทราบแล้ว</li>'+
        '<li><svg><use href="#i-check"/></svg>แนบบัตรประชาชน + รูปน้อง '+media.pets.length+' รูป</li>'+
      '</ul>'+
      (owner.email?'<p style="margin-top:14px;">📧 เราส่งอีเมลยืนยันไปที่ '+esc(owner.email)+' แล้ว</p>':'')+
      '<p style="margin-top:6px;font-size:13px;">หากต้องแก้ไขข้อมูล ทักได้ที่ LINE @perfectbkk</p>'+
      '<a class="home-btn" href="/">กลับสู่หน้าแรก ›</a>'+
      '</div>';
    window.scrollTo(0,0);
  }

  // ═══════ INIT ═══════
  if(loadDraft()){ /* มีร่างเดิม — เริ่มที่หน้า intro ให้เลือกกรอกต่อหรือล้าง */ }
  render();
})();
</script>
